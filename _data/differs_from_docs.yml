- name: "Error"
  url: "/ecmascript-builtins/error/"
  officialUrl: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Error"
  tagline: "new Error(\"msg\") does not expose .message"
  part: "ecmascript"
  category: "ECMAScript Builtins"
  object: "Error"
  severity: "high"
  discrepancy: "A4"
  anchor: "error-new-error-msg-does-not-expose-message"
  body: |
    Unlike standard JavaScript, a JS-constructed `new Error("msg")` in the SFMC Jint engine does **not** expose the message via `.message` — `err.message` reads back `undefined`, and `Stringify(err)` returns an empty `{}` (the underlying `{jintException}` / .NET stack is hidden), not the message. Recover the message with `String(err)` or `("" + err)` (both yield the constructor argument), or `err.toString()` (yields `"Error: undefined"`). This differs from **engine-raised** errors, which DO carry `.message` + `.description`. Do not rely on `new Error(...).message`.
  testScript: |
    <script runat="server">
    Platform.Load("core","1.1.5");
    // Build a JS Error and inspect how the engine exposes its message
    try {
      var err = new Error("boom");
      // OBSERVED (SFMC): message: undefined (not "boom")
      Platform.Response.Write("message: " + err.message + "\n");
      // OBSERVED (SFMC): stringify: {} (empty object - the {jintException}/.NET stack is hidden, message not surfaced)
      Platform.Response.Write("stringify: " + Platform.Function.Stringify(err) + "\n");
      // OBSERVED (SFMC): String(err): boom and concat: boom (both recover the constructor argument)
      Platform.Response.Write("String(err): " + String(err) + "\n");
      Platform.Response.Write("concat: " + ("" + err) + "\n");
      // OBSERVED (SFMC): toString: Error: undefined
      Platform.Response.Write("toString: " + err.toString() + "\n");
    } catch (e) { Platform.Response.Write("ERROR: " + Platform.Function.Stringify(e) + "\n"); }
    </script>

- name: "HTTPHeader (bare-name global)"
  url: "/core-library/httpheader/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud/guide/ssjs_utilitiesHTTPHeaderObject.html"
  tagline: "separate inbound/outbound collections"
  part: "sfmc"
  category: "Core Library"
  object: "HTTPHeader"
  severity: "medium"
  discrepancy: "A2"
  anchor: "httpheader-bare-name-global-separate-inbound-outbound-collections"
  body: |
    Available after `Platform.Load("core", ...)`. `GetValue` reads **inbound** request headers and returns `null` for a header you set via `SetValue` (separate inbound vs outbound collections). `Remove` returns `undefined`, not the `"OK"` string implied by some docs.
  testScript: |
    <script runat="server">
    Platform.Load("core", "1.1.5");

    // Probe 1: SetValue writes to the OUTBOUND collection, GetValue reads INBOUND
    try {
        HTTPHeader.SetValue("X-Custom-Test", "hello");
        var readBack = HTTPHeader.GetValue("X-Custom-Test");
        Platform.Response.Write("GetValue after SetValue = " + Platform.Function.Stringify(readBack) + "\n");
        // OBSERVED: null - GetValue reads inbound headers, not the outbound header you just set
    } catch (e) {
        Platform.Response.Write("ERROR: " + Platform.Function.Stringify(e) + "\n");
    }

    // Probe 2: GetValue on a real inbound header (present on most requests)
    try {
        var host = HTTPHeader.GetValue("Host");
        Platform.Response.Write("GetValue('Host') = " + Platform.Function.Stringify(host) + "\n");
        // OBSERVED: \"mct0l7nxfq2r988t1kxfy8sc47mq.pub.sfmc-content.com\" - the real inbound Host header value
    } catch (e) {
        Platform.Response.Write("ERROR: " + Platform.Function.Stringify(e) + "\n");
    }

    // Probe 3: Remove returns undefined, not the \"OK\" string some docs imply
    try {
        var removed = HTTPHeader.Remove("X-Custom-Test");
        Platform.Response.Write("Remove() = " + Platform.Function.Stringify(removed) + "\n");
        Platform.Response.Write("typeof Remove() = " + (typeof removed) + "\n");
        // OBSERVED: typeof = undefined (NOT \"OK\"); Stringify prints null for undefined
    } catch (e) {
        Platform.Response.Write("ERROR: " + Platform.Function.Stringify(e) + "\n");
    }
    </script>

- name: "ErrorUtil (bare-name global)"
  url: "/wsproxy/errorutil/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud/guide/ssjs_WSProxy_errorUtilThrow.html"
  tagline: "only in Core \"1\""
  part: "sfmc"
  category: "WSProxy"
  object: "ErrorUtil"
  severity: "medium"
  discrepancy: "A6"
  anchor: "errorutil-bare-name-global-only-in-core-1"
  body: |
    `ErrorUtil` is provided **only** by `Platform.Load("Core", "1")`. Under newer Core versions (`"1.1.1"`, `"1.1.5"`, …) it is `undefined`. Effectively deprecated in Core > 1. Prefer checking `result.Status` and throwing `new Error(...)` instead of `ErrorUtil.ThrowWSProxyError`.
  testScript: |
    <script runat="server">
    Platform.Load("core", "1.1.5");

    // Probe: under Core 1.1.5 the ErrorUtil global is undefined (only Core \"1\" provides it)
    try {
        Platform.Response.Write("typeof ErrorUtil (Core 1.1.5) = " + (typeof ErrorUtil) + "\n");
        // OBSERVED: \"undefined\" under Core 1.1.5
    } catch (e) {
        Platform.Response.Write("ERROR: " + Platform.Function.Stringify(e) + "\n");
    }

    // Counter-probe (separate deploy): swapping the load to Platform.Load("Core", "1")
    // and re-running yields typeof ErrorUtil = \"object\" (OBSERVED). This confirms the
    // version split: ErrorUtil exists only under Core \"1\", not Core > 1.

    // Probe: preferred alternative - check result.Status and throw a plain Error
    try {
        var fakeResult = { Status: "Error" };
        if (fakeResult.Status != "OK") {
            throw new Error("WSProxy call failed with Status = " + fakeResult.Status);
        }
        Platform.Response.Write("OK\n");
    } catch (e) {
        Platform.Response.Write("Caught expected error: " + Platform.Function.Stringify(e) + "\n");
        // Prefer new Error(...) over ErrorUtil.ThrowWSProxyError in Core > 1
    }
    </script>

- name: "Attribute.GetValue"
  url: "/core-library/attribute/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud/guide/ssjs_recipientGetValue.html"
  tagline: "works in CloudPages, returns \"\" when no recipient"
  part: "sfmc"
  category: "Core Library"
  object: "Attribute"
  severity: "medium"
  discrepancy: "A6"
  anchor: "attribute-getvalue-works-in-cloudpages-returns-when-no-recipient"
  body: |
    After `Platform.Load("Core", ...)` the `Attribute` object exists and `Attribute.GetValue(name)` executes and returns a string — it is **not** unavailable in CloudPages, contrary to what the docs imply. When no subscriber/attribute is in context (e.g. a plain CloudPage GET) it returns an **empty string** rather than throwing. In email/triggered-send/personalized contexts it returns the actual attribute value.
  testScript: |
    <script runat="server">
    Platform.Load("core", "1.1.5");

    // Probe 1: the Attribute object exists after Platform.Load in a CloudPage
    try {
        Platform.Response.Write("typeof Attribute = " + (typeof Attribute) + "\n");
        // OBSERVED: \"object\" - Attribute is available in CloudPages, contrary to docs
    } catch (e) {
        Platform.Response.Write("ERROR: " + Platform.Function.Stringify(e) + "\n");
    }

    // Probe 2: GetValue on a plain CloudPage GET returns an empty string (no throw)
    try {
        var val = Attribute.GetValue("FirstName");
        Platform.Response.Write("Attribute.GetValue('FirstName') = '" + val + "' (length " + String(val).length + ")\n");
        // OBSERVED: '' (length 0) on a plain CloudPage GET - no throw (actual value in email/send context)
    } catch (e) {
        Platform.Response.Write("ERROR: " + Platform.Function.Stringify(e) + "\n");
    }
    </script>

- name: "Platform.Function.HTTPGet"
  url: "/platform-functions/httpget/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud/guide/ssjs_platformContentSyndicationHTTPGet.html"
  tagline: "returns the body, and all 6 args are required"
  part: "sfmc"
  category: "Platform Functions"
  object: "Platform.Function"
  severity: "high"
  discrepancy: "A1"
  anchor: "platform-function-httpget-returns-the-body-and-all-6-args-are-required"
  body: |
    The return value is the **response body as a string**, not a numeric status — the official docs' claim that this returns a numeric status is wrong (`typeof body === "string"`, and the body contains the fetched response). Two further points about the signature also differ from the docs:

    1. A **1-argument** call `HTTPGet(url)` succeeds and returns a string, so it is **not** true that all six arguments are required. (A **2-argument** call `HTTPGet(url, false)` throws the generic *"Unable to retrieve security descriptor for this frame."* error — the signal for an argument count the engine does not accept — while the 6-arg form succeeds; valid arities are exactly {1, 6}, not a simple "all required".)
    2. The `statusVariable` out-parameter is **not** populated in a CloudPage context: after a 6-arg call, `status.length === 0` and `status[0] === undefined`. Do not rely on `statusVariable[0]` for the numeric status here.

    Prefer the 6-argument form for the response body, but read the status from the body/HTTP response itself rather than the out-parameter.
  testScript: |
    <script runat="server">
    Platform.Load("core","1.1.5");
    // HTTPGet returns the response BODY as a string. Live retest checks arg-count and statusVariable behaviour.
    // Test A: 1-arg call (claim said all 6 required)
    try {
      var b1 = Platform.Function.HTTPGet("https://httpbin.org/status/200");
      Platform.Response.Write("A 1-arg: OK typeof=" + (typeof b1) + " len=" + String(b1).length + "\n");
      // OBSERVED: 1-arg succeeds, typeof=string, len=0 (CONTRADICTS \"all six args required\")
    } catch (e) { Platform.Response.Write("A 1-arg ERROR: " + Platform.Function.Stringify(e) + "\n"); }

    // Test B: 6-arg call with a status array; inspect whether the out-parameter is populated
    try {
      var status = [];
      var b6 = Platform.Function.HTTPGet("https://httpbin.org/status/200", false, 0, null, null, status);
      Platform.Response.Write("B 6-arg: typeof body=" + (typeof b6) + "\n");
      Platform.Response.Write("B status.length=" + status.length + " status[0]=" + status[0] + "\n");
      // OBSERVED: typeof body=string; status.length=0, status[0]=undefined (statusVariable NOT populated)
    } catch (e) { Platform.Response.Write("B 6-arg ERROR: " + Platform.Function.Stringify(e) + "\n"); }

    // Test C: 2-arg call
    try {
      var b2 = Platform.Function.HTTPGet("https://httpbin.org/status/200", false);
      Platform.Response.Write("C 2-arg: OK typeof=" + (typeof b2) + "\n");
    } catch (e) { Platform.Response.Write("C 2-arg ERROR: " + Platform.Function.Stringify(e) + "\n"); }
    // OBSERVED: C 2-arg throws \"Unable to retrieve security descriptor for this frame.\"
    </script>

- name: "Platform.Function.Base64Encode"
  url: "/platform-functions/base64encode/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud/guide/ssjs_platformUtilityBase64Encode.html"
  tagline: "standard interoperable Base64"
  part: "sfmc"
  category: "Platform Functions"
  object: "Platform.Function"
  severity: "low"
  discrepancy: "A7"
  anchor: "platform-function-base64encode-standard-interoperable-base64"
  body: |
    The official docs state the output "can only be decoded by the matching `Base64Decode()` function." Runtime testing shows the output is **standard, interoperable Base64** — any Base64 decoder (in any language) can decode it. There is nothing proprietary about the encoding.
  testScript: |
    <script runat="server">
    Platform.Load("core","1.1.5");
    // Base64Encode produces STANDARD, interoperable Base64 (nothing proprietary).
    try {
      var input = "Hello, SFMC!";
      var encoded = Platform.Function.Base64Encode(input);
      // OBSERVED: encoded === "SGVsbG8sIFNGTUMh" (match: true) - standard Base64, decodable anywhere.
      Platform.Response.Write("input:   " + input + "\n");
      Platform.Response.Write("encoded: " + encoded + "\n");
      Platform.Response.Write("EXPECTED standard Base64: SGVsbG8sIFNGTUMh\n");
      Platform.Response.Write("match: " + (encoded === "SGVsbG8sIFNGTUMh") + "\n");
    } catch (e) { Platform.Response.Write("ERROR: " + Platform.Function.Stringify(e) + "\n"); }
    </script>

