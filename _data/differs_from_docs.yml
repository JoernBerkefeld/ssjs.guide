- name: "Platform.Function.ParseJSON"
  url: "/platform-functions/parsejson/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud/guide/ssjs_platformUtilityParseJSON.html"
  tagline: "string-only argument, returns string/null for scalars & invalid input"
  part: "sfmc"
  category: "Platform Functions"
  object: "Platform.Function"
  severity: "high"
  discrepancy: "A3"
  anchor: "platform-function-parsejson-string-only-argument-returns-string-null-for-scalars-invalid-input"
  body: |
    The official docs are wrong on two counts:

    1. They type the argument as `string or string[]` and describe passing an "array of strings". At runtime passing an array — or any non-string object — throws `System.InvalidOperationException` (*"Unable to retrieve security descriptor for this frame."*). Only a **single string argument** is accepted (calling with no argument at all throws the same error). Non-string **scalar** arguments (number, boolean) are coerced to their string form (e.g. `ParseJSON(true)` returns the string `"True"`).
    2. They give the return type as `object|object[]`. That is incomplete: JSON objects/arrays deserialise as expected, but a **scalar** JSON value (`'"hello"'` → the string `"hello"` *with quotes preserved*, `'42'` → the string `"42"`, `'true'` → the string `"true"`) is returned **as a string**. Only **empty**, **whitespace-only**, `null`-argument, and `undefined`-argument input returns a genuine JS **`null`** — it does **not** throw. **Invalid/malformed JSON (e.g. `"not json {"`) is NOT null**: the runtime returns the **input string unchanged** (typeof `string`). The literal string `"null"` likewise returns the **string** `"null"`, not JS `null`. So the return union is `object|object[]|string|null` — invalid input returns the raw string rather than `null`.
  testScript: |
    <script runat="server">
    Platform.Load("core","1.1.5");
    // ParseJSON: SINGLE STRING arg only (object/array/no-arg throw). Objects/arrays deserialise; scalars
    // returned as-is (string); invalid input returns the raw string; empty/whitespace/null/undefined -> null.
    try {
      // Object JSON deserialises as expected.
      var obj = Platform.Function.ParseJSON('{"a":1,"b":"two"}');
      Platform.Response.Write("object typeof=" + (typeof obj) + " a=" + obj.a + " b=" + obj.b + "\n");
      // OBSERVED: object typeof=object a=1 b=two
    } catch (e) { Platform.Response.Write("object ERROR: " + Platform.Function.Stringify(e) + "\n"); }
    try {
      // Scalar STRING JSON returned as a string (quotes preserved).
      var scalar = Platform.Function.ParseJSON('"hello"');
      Platform.Response.Write("scalar typeof=" + (typeof scalar) + " value=" + scalar + "\n");
      // OBSERVED: scalar typeof=string value="hello"  (the surrounding quotes are preserved)
    } catch (e) { Platform.Response.Write("scalar ERROR: " + Platform.Function.Stringify(e) + "\n"); }
    try {
      // INVALID JSON is NOT null: it returns the input string unchanged.
      var bad = Platform.Function.ParseJSON("not json {");
      Platform.Response.Write("invalid typeof=" + (typeof bad) + " ===null=" + (bad === null) + " value=" + bad + "\n");
      // OBSERVED: invalid typeof=string ===null=false value=not json {  (claim "invalid -> null" is WRONG)
    } catch (e) { Platform.Response.Write("invalid ERROR: " + Platform.Function.Stringify(e) + "\n"); }
    try {
      // Empty / null-arg / undefined-arg genuinely return JS null.
      Platform.Response.Write("empty ===null=" + (Platform.Function.ParseJSON("") === null) + "\n");
      Platform.Response.Write("nullArg ===null=" + (Platform.Function.ParseJSON(null) === null) + "\n");
      Platform.Response.Write("undefArg ===null=" + (Platform.Function.ParseJSON(undefined) === null) + "\n");
      // OBSERVED: empty ===null=true ; nullArg ===null=true ; undefArg ===null=true
    } catch (e) { Platform.Response.Write("null-cases ERROR: " + Platform.Function.Stringify(e) + "\n"); }
    try {
      // Passing an object/array throws the generic unknown-member/wrong-arity error.
      Platform.Function.ParseJSON({ a: 1 });
      Platform.Response.Write("object-arg: unexpectedly OK\n");
    } catch (e) { Platform.Response.Write("object-arg ERROR (expected): " + Platform.Function.Stringify(e) + "\n"); }
    // OBSERVED: object/array arg throws "Unable to retrieve security descriptor for this frame." (System.InvalidOperationException); live-verified 2026-07-20
    </script>

- name: "Platform.Function.RaiseError"
  url: "/platform-functions/raiseerror/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud/guide/ssjs_platformUtilityRaiseError.html"
  tagline: "only message is required; errorCode/errorNumber not exposed on the caught error"
  part: "sfmc"
  category: "Platform Functions"
  object: "Platform.Function"
  severity: "medium"
  discrepancy: "A3"
  anchor: "platform-function-raiseerror-only-message-is-required-errorcode-errornumber-not-exposed-on-the-caught-error"
  body: |
    The official docs are wrong on two counts:

    1. They mark `currentRecipientOnly`, `errorCode`, and `errorNumber` as **required**, but at runtime a single `message` argument raises correctly — those three are **optional** (`minArgs: 1`).
    2. When the raised error is caught in a CloudPage `try`/`catch`, the exception exposes only `.message` (the passed text) and `.description` (an `ExactTarget.OMM.AMPScriptRaiseErrorException`); the `errorCode` and `errorNumber` values are **not** surfaced on the error object — even when all four arguments are supplied, `.errorCode`, `.number`, and `.errorNumber` all read back `undefined`. The exception is a normal catchable object (`.name` is `"TypeError"`), so on a CloudPage `RaiseError` can be caught rather than fatally halting the page (execution continues after the `catch`).
  testScript: |
    <script runat="server">
    Platform.Load("core","1.1.5");
    // RaiseError: a single message arg is enough (others optional); it is CATCHABLE on a CloudPage.
    Platform.Response.Write("before RaiseError\n");
    try {
      // Only the message argument supplied (minArgs: 1).
      Platform.Function.RaiseError("custom failure text");
      Platform.Response.Write("no throw: unexpected\n");
    } catch (e) {
      // caught: .message = passed text; .name = "TypeError"; .description = AMPScriptRaiseErrorException; codes undefined.
      Platform.Response.Write(".message: " + e.message + "\n");
      Platform.Response.Write(".name: " + e.name + "\n");
      Platform.Response.Write(".description: " + e.description + "\n");
      Platform.Response.Write(".errorCode: " + e.errorCode + "\n");
      Platform.Response.Write(".number: " + e.number + "\n");
      Platform.Response.Write(".errorNumber: " + e.errorNumber + "\n");
    }
    Platform.Response.Write("after catch: execution continued\n");
    // Full 4-arg form still does NOT surface errorCode/errorNumber on the caught error.
    try {
      Platform.Function.RaiseError("full arg text", true, "MYCODE", 100);
    } catch (e2) {
      Platform.Response.Write("4arg .errorCode: " + e2.errorCode + " .number: " + e2.number + " .errorNumber: " + e2.errorNumber + "\n");
    }
    // OBSERVED (live 2026-07-20): single message arg raises fine (minArgs:1); caught e.name="TypeError", e.message="custom failure text", e.description="ExactTarget.OMM.AMPScriptRaiseErrorException: ... - from Jint", e.errorCode/e.number/e.errorNumber all undefined (even with 4 args); execution continued after catch (catchable, not fatal). CLAIM CONFIRMED.
    </script>

- name: "Platform.Function.RedirectTo"
  url: "/platform-functions/redirectto/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud/guide/ssjs_platformHTTPRedirectTo.html"
  tagline: "returns the URL string, does not redirect from SSJS"
  part: "sfmc"
  category: "Platform Functions"
  object: "Platform.Function"
  severity: "high"
  discrepancy: "A1"
  anchor: "platform-function-redirectto-returns-the-url-string-does-not-redirect-from-ssjs"
  body: |
    The official docs present `RedirectTo` as an email link-target helper that returns no value (`@returns {void}`). At runtime from SSJS it **returns the passed-in URL as a `string`** (not `void`); execution continues after the call and **no HTTP redirect is issued** in a CloudPage context. The string is returned verbatim with no validation — an empty string returns `""` and a non-URL string is returned unchanged, neither throwing nor redirecting. For CloudPage HTTP redirects use `Platform.Response.Redirect` instead.
  testScript: |
    <script runat="server">
    Platform.Load("core","1.1.5");
    // RedirectTo returns the passed-in URL as a STRING on a CloudPage; no HTTP redirect is issued.
    Platform.Response.Write("before RedirectTo\n");
    try {
      var url = "https://example.com/next";
      var ret = Platform.Function.RedirectTo(url);
      // typeof "string", ret === the passed URL; execution continues (no redirect on CloudPage).
      Platform.Response.Write("return typeof: " + (typeof ret) + "\n");
      Platform.Response.Write("ret === url: " + (ret === url) + "\n");
      Platform.Response.Write("after RedirectTo: execution continued\n");
      // NOTE: for a real CloudPage HTTP redirect use Platform.Response.Redirect instead.
    } catch (e) { Platform.Response.Write("ERROR: " + Platform.Function.Stringify(e) + "\n"); }
    // Edge cases: empty string and non-URL string are returned verbatim (no throw, no redirect).
    try { var e1 = Platform.Function.RedirectTo(""); Platform.Response.Write("empty: typeof=" + (typeof e1) + " isEmpty=" + (e1 === "") + "\n"); } catch (ex1) { Platform.Response.Write("empty THREW -> " + ex1.message + "\n"); }
    try { var e2 = Platform.Function.RedirectTo("not a url at all"); Platform.Response.Write("nonurl: typeof=" + (typeof e2) + " val=[" + e2 + "]\n"); } catch (ex2) { Platform.Response.Write("nonurl THREW -> " + ex2.message + "\n"); }
    // OBSERVED (live 2026-07-20): RedirectTo("https://example.com/next") returned typeof "string" with ret === url (verbatim); execution continued with NO HTTP redirect on the CloudPage; empty string returned "" and non-URL string returned unchanged, neither throwing nor redirecting. CLAIM CONFIRMED (docs say @returns {void}; runtime returns the URL string and does not redirect from SSJS).
    </script>
- name: "Platform.Request.GetQueryStringParameter"
  url: "/platform-objects/platform-request/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud/guide/ssjs_platformHTTPPropertyGetQueryStringParameter.html"
  tagline: "returns null (not \"\") when absent"
  part: "sfmc"
  category: "Platform Objects"
  object: "Platform.Request"
  severity: "medium"
  discrepancy: "A2"
  anchor: "platform-request-getquerystringparameter"
  body: |
    For an **absent** parameter this returns `null` (`typeof "object"`, `=== null`), **not** an empty string — the docs give no indication of the empty-vs-null behavior. A **present** parameter returns its string value (`typeof "string"`); a present-but-empty parameter (`?p=`) returns `""` (not `null`), so `null` reliably means "absent". Key lookup is **case-insensitive** (`?Case=X` is readable as both `"case"` and `"Case"`), and a **repeated** parameter (`?p=1&p=2`) is returned as a single comma-joined string (`"1,2"`). Guard reads with a truthiness / `!= null` check.
  testScript: |
    <script runat="server">
    Platform.Load("core","1.1.5");
    // OBSERVED (live 2026-07-20, fetched with ?id=hello&multi=1&multi=2&Case=X&empty=):
    // absent -> typeof "object", ===null true, ===""" false (returns null, NOT "");
    // present 'id' -> "hello" (typeof string); multi 'multi' (?multi=1&multi=2) -> "1,2" (comma-joined string);
    // case 'Case=X' readable via both "case" and "Case" -> "X" (case-INSENSITIVE keys);
    // empty '?empty=' -> "" (typeof string, ===null false, ==='' true) so null only ever means absent.
    // CLAIM CONFIRMED: absent returns null (typeof "object"), not "".
    try {
      var missing = Platform.Request.GetQueryStringParameter("definitelyNotPresent");
      Platform.Response.Write("absent typeof: " + (typeof missing) + "\n");
      Platform.Response.Write("absent === null: " + (missing === null) + "\n");
      Platform.Response.Write("absent === '': " + (missing === "") + "\n");
      var present = Platform.Request.GetQueryStringParameter("id");
      Platform.Response.Write("present ('id'): [" + present + "] typeof=" + (typeof present) + "\n");
      var multi = Platform.Request.GetQueryStringParameter("multi");
      Platform.Response.Write("multi ('multi'): [" + multi + "] typeof=" + (typeof multi) + "\n");
      Platform.Response.Write("case lower ('case'): [" + Platform.Request.GetQueryStringParameter("case") + "]\n");
      Platform.Response.Write("case upper ('Case'): [" + Platform.Request.GetQueryStringParameter("Case") + "]\n");
      var emptyVal = Platform.Request.GetQueryStringParameter("empty");
      Platform.Response.Write("empty ('empty'): [" + emptyVal + "] ===null:" + (emptyVal === null) + " ==='':" + (emptyVal === "") + "\n");
    } catch (e) { Platform.Response.Write("ERROR: " + Platform.Function.Stringify(e) + "\n"); }
    </script>

