- name: "Object ES5/ES6 statics"
  url: "/ecmascript-builtins/object-methods/"
  officialUrl: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object"
  tagline: "most are missing"
  part: "ecmascript"
  category: "ECMAScript Builtins"
  object: "Object"
  severity: "medium"
  discrepancy: "B2"
  anchor: "object-statics-missing"
  body: |
    MDN documents a large set of `Object` statics. In the SFMC Jint engine only `Object.defineProperty` and `Object.getPrototypeOf` are present and working — **`keys`, `values`, `entries`, `assign`, `create`, `freeze`, `isFrozen`, `defineProperties`, `getOwnPropertyNames`, `getOwnPropertyDescriptor`, `seal`, `isSealed`, `preventExtensions`, and `isExtensible` are all `undefined`**. Use a `for...in` loop with `hasOwnProperty` for key/value enumeration; there is no runtime immutability or extensibility control. See [Object Methods](/ecmascript-builtins/object-methods/) for per-member workarounds.
