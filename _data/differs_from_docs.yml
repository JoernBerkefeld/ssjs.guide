- name: "&lt;QueryDefinitionInstance&gt;.Perform"
  url: "/core-library/querydefinition/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud/guide/ssjs_queryDefinitionPerform.html"
  tagline: "returns a status string, not \"OK\""
  part: "sfmc"
  category: "Core Library"
  object: "QueryDefinitionInstance"
  severity: "medium"
  discrepancy: "A1"
  anchor: "querydefinitioninstance-perform"
  body: |
    The official docs annotate `<QueryDefinitionInstance>.Perform(action)` as `@returns {Enum("OK")}`, but at runtime `Perform(action)` **returns a status string, never the enum `"OK"`**. `QueryDefinition.Init(key)` returns a working instance object and `qd.Perform` is a `function` with arity 3. On a **valid** query key, `Perform("start")` queues the run asynchronously and returns a success string (`"QueryDefinition perform called successfully"`); on an **invalid / non-existent** key it does **not throw** — it returns the failure as a string of the form `"Exception occurred during [Schedule::Start] ErrorID = <number>"`. Because both success and failure come back as return strings, detect failure by inspecting the returned string, not by string-matching `"OK"` and not by relying on an exception.
  testScript: |
    <script runat="server">
    Platform.Load("core", "1.1.5");
    // NON-DESTRUCTIVE probe: <QueryDefinitionInstance>.Perform(action) return value.
    // Docs annotate @returns Enum("OK"); a bogus/non-existent key means no real query runs.
    // OBSERVED: QueryDefinition.Init -> function, returns object; qd.Perform -> function, arity 3.
    // OBSERVED: qd.Perform("start") on a non-existent key returned the STRING (did NOT throw):
    //   "Exception occurred during [Schedule::Start] ErrorID = 842727025"
    //   -> not "OK" and not "QueryDefinition perform called successfully"; CONFIRMS return type is a
    //      status string, not Enum("OK"); failure is signalled via the returned string, not a throw.
    try {
        var qd = QueryDefinition.Init("__qa_probe_nonexistent_query_key__");
        Platform.Response.Write("typeof qd.Perform: " + typeof qd.Perform + "\n");
        Platform.Response.Write("qd.Perform.length (arity): " + qd.Perform.length + "\n");
        var result = qd.Perform("start");
        Platform.Response.Write("typeof result: " + typeof result + "\n");
        Platform.Response.Write("Perform result: " + Platform.Function.Stringify(result) + "\n");
        Platform.Response.Write("is exactly 'OK'? " + (String(result) === "OK") + "\n");
    } catch (e) {
        Platform.Response.Write("THREW: " + Platform.Function.Stringify(e) + "\n");
    }
    </script>

