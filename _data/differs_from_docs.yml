    // separator is built with String.fromCharCode(92).
    // FIXTURES: "ssjs-guide-test-block" sits in the Content Builder root,
    // "ssjs-guide-folder-block" one folder deep under "ssjs-guide-tests"; the
    // xyz name does not exist.
