  severity: "medium"
  discrepancy: "A1"
  anchor: "filterdefinition-add-update-remove"
  body: |
    The official docs state these return `"OK"` on success or throw on failure. At runtime, on failure they return the plain string **`"Error"`** and do **not** throw — `FilterDefinition.Add(...)` with both DataExtension and SubscriberList `DataSource`s, and instance `Update`/`Remove` against a non-existent definition, all return the string `"Error"` without throwing. A direct WSProxy `createItem("FilterDefinition")` throws a SOAP inner exception *"Invalid property name: Type"* on `DataSource`. Treat a non-`"OK"` return as failure rather than relying on a thrown exception. `Update`/`Remove` arity is 1/1.
  testScript: |
    <script runat="server">
    Platform.Load("core", "1.1.5");
    // Probe: FilterDefinition.Add / <inst>.Update / <inst>.Remove failure behaviour.
    // Docs say they return "OK" or throw; runtime returns the string "Error" and does NOT throw.
    // NON-DESTRUCTIVE: Add uses clearly-invalid DataSources (nonexistent DE / list keys) so
    // nothing valid is created; Update/Remove run against a non-existent definition key.
    // OBSERVED: P2 Add(invalid DE) -> "Error" (no throw); P3 Add(invalid SubscriberList) -> "Error" (no throw);
    // OBSERVED: P4 <inst>.Update(non-existent) -> "Error" (no throw); P5 <inst>.Remove(non-existent) -> "Error" (no throw).
    function pre(t) { Platform.Response.Write(t + "\n"); }
    // P2 — Add with an invalid DataExtension DataSource.
    try {
        var badFD = {
            Name: "SSJSGUIDE_INVALID_PROBE_DO_NOT_KEEP",
            CustomerKey: "SSJSGUIDE_INVALID_PROBE_KEY",
            Filter: { Property: "LuckyNumber", SimpleOperator: "equals", Value: 77 },
            DataSource: { Type: "DataExtension", CustomerKey: "SSJSGUIDE_NO_SUCH_DE_XYZ" }
        };
        var addResult = FilterDefinition.Add(badFD);
        pre("Add(invalid DE) RETURNED typeof=" + (typeof addResult) + " value=" + addResult); // OBSERVED: string "Error"
    } catch (e2) { pre("Add(invalid DE) THREW -> " + e2); }
    // P3 — Add with an invalid SubscriberList DataSource.
    try {
        var badFD2 = {
            Name: "SSJSGUIDE_INVALID_PROBE_2_DO_NOT_KEEP",
            CustomerKey: "SSJSGUIDE_INVALID_PROBE_KEY_2",
            Filter: { Property: "LuckyNumber", SimpleOperator: "equals", Value: 77 },
            DataSource: { Type: "SubscriberList", CustomerKey: "SSJSGUIDE_NO_SUCH_LIST_XYZ" }
        };
        var addResult2 = FilterDefinition.Add(badFD2);
        pre("Add(invalid SubscriberList) RETURNED typeof=" + (typeof addResult2) + " value=" + addResult2); // OBSERVED: string "Error"
    } catch (e3) { pre("Add(invalid SubscriberList) THREW -> " + e3); }
    // P4 — instance Update against a non-existent definition (nothing real mutated).
    try {
        var fdU = FilterDefinition.Init("SSJSGUIDE_NONEXISTENT_FD_KEY");
        var updResult = fdU.Update({ Name: "SSJSGUIDE_NEVER_APPLIED" });
        pre("<inst>.Update(non-existent) RETURNED typeof=" + (typeof updResult) + " value=" + updResult); // OBSERVED: string "Error"
    } catch (e4) { pre("<inst>.Update THREW -> " + e4); }
    // P5 — instance Remove against a non-existent definition (nothing real deleted).
    try {
        var fdR = FilterDefinition.Init("SSJSGUIDE_NONEXISTENT_FD_KEY");
        var remResult = fdR.Remove();
        pre("<inst>.Remove(non-existent) RETURNED typeof=" + (typeof remResult) + " value=" + remResult); // OBSERVED: string "Error"
    } catch (e5) { pre("<inst>.Remove THREW -> " + e5); }
    </script>

- name: "&lt;SendInstance&gt;.Tracking click & interval retrieval"
  url: "/core-library/send/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud/guide/ssjs_sendTrackingClicksRetrieve.html"
  tagline: "Clicks.Retrieve / TotalByInterval.Retrieve, not ClickRetrieve / TotalByIntervalRetrieve"
  part: "sfmc"
  category: "Core Library"
  object: "SendInstance"
  severity: "medium"
  discrepancy: "A4"
  anchor: "sendinstance-tracking-click-interval-retrieval"
  body: |
    The official docs document per-send tracking as `<SendInstance>.Tracking.ClickRetrieve(filter)` and `<SendInstance>.Tracking.TotalByIntervalRetrieve(type, startDate, endDate, groupBy)`. At runtime both of those names are `undefined`. The instance `Tracking` property is an object exposing two **sub-objects** — `Clicks` and `TotalByInterval` — each with a `Retrieve` method. The working calls are `<SendInstance>.Tracking.Clicks.Retrieve(filter)` and `<SendInstance>.Tracking.TotalByInterval.Retrieve(type, startDate, endDate, groupBy)`. This mirrors the `TriggeredSend.Tracking.Clicks` / `TriggeredSend.Tracking.TotalByInterval` shape. The static `Send.Tracking.Retrieve(filter)` (no `Send.Init` required) is unaffected.
  testScript: |
    <script runat="server">
    Platform.Load("core", "1.1.5");
    // Probe: per-send Tracking API shape. Docs show <SendInstance>.Tracking.ClickRetrieve /
    // .TotalByIntervalRetrieve, but at runtime those names are undefined. The working shape is
    // Tracking.Clicks.Retrieve(...) and Tracking.TotalByInterval.Retrieve(...). READ-ONLY probe.
    // Uses a non-existent Send id (shape check does not require a real send). No mutation.
    // OBSERVED (live CloudPage, MCDEV_Training_QA): send.Tracking = object; tracking.ClickRetrieve
    // = undefined; tracking.TotalByIntervalRetrieve = undefined; tracking.Clicks = object;
    // tracking.Clicks.Retrieve = function; tracking.TotalByInterval = object;
    // tracking.TotalByInterval.Retrieve = function; enumerated Tracking keys = [Clicks, TotalByInterval].
    // => CONFIRMED: documented flat names do not exist; working shape is the two Retrieve sub-objects.
    try {
        var send = Send.Init(999999999); // non-existent Send id — read-only shape check
        var tracking = send.Tracking;
        // EXPECTED: documented names are undefined; sub-objects Clicks / TotalByInterval exist.
        Platform.Response.Write("typeof ClickRetrieve: " + typeof tracking.ClickRetrieve + "\n"); // OBSERVED: "undefined"
        Platform.Response.Write("typeof TotalByIntervalRetrieve: " + typeof tracking.TotalByIntervalRetrieve + "\n"); // OBSERVED: "undefined"
        Platform.Response.Write("typeof Clicks: " + typeof tracking.Clicks + "\n"); // OBSERVED: "object"
        Platform.Response.Write("typeof Clicks.Retrieve: " + typeof tracking.Clicks.Retrieve + "\n"); // OBSERVED: "function"
        Platform.Response.Write("typeof TotalByInterval.Retrieve: " + typeof tracking.TotalByInterval.Retrieve + "\n"); // OBSERVED: "function"
        var keys = "";
        for (var k in tracking) { keys += k + ", "; }
        Platform.Response.Write("Tracking keys: [" + keys + "]\n"); // OBSERVED: [Clicks, TotalByInterval, ]
    } catch (e) {
        Platform.Response.Write("ERROR: " + Platform.Function.Stringify(e) + "\n");
    }
    </script>

- name: "&lt;SendInstance&gt;.CancelSend"
  url: "/core-library/send/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud/guide/ssjs_sendCancelSend.html"
  tagline: "returns \"status\", not \"OK\""
  part: "sfmc"
  category: "Core Library"
  object: "SendInstance"
  severity: "medium"
  discrepancy: "A1"
  anchor: "sendinstance-cancelsend"
  body: |
    The official docs describe `<SendInstance>.CancelSend()` as returning the enum `"OK"` on success and throwing an error "if something went wrong". Neither part matches the runtime. `CancelSend()` **returns a `string`** and does **not** throw on failure — for a missing send it returns the status message `"Send [ID: 999999999] not found. [ErrorID: 2063583072]"` (a `string`, not `"OK"`). So the documented `"OK"` enum and the "throws on error" behaviour are both wrong: the method reports its outcome via a returned status string. On the success path the return is the literal string `"status"` rather than `"OK"`. Do not compare the return against `"OK"` and do not rely on a thrown error to detect failure; inspect the returned status string instead.
  testScript: |
    <script runat="server">
    Platform.Load("core", "1.1.5");
    // Probe (NON-DESTRUCTIVE): <SendInstance>.CancelSend() signature & return value.
    // Docs say CancelSend() returns the enum "OK" on success and throws on error.
    // We probe safely against an obviously-invalid / non-existent Send id (999999999)
    // so NOTHING real is cancelled: we check typeof CancelSend, its arity, and what it
    // returns/throws for a missing send.
    // OBSERVED (live CloudPage): typeof send.CancelSend === "function";
    //   send.CancelSend.length === 2; for a non-existent send CancelSend() did NOT throw and
    //   RETURNED a string (typeof result === "string", result !== "OK", result !== "status"):
    //   "Send [ID: 999999999] not found. [ErrorID: 2063583072]".
    //   => The documented '"OK" enum + throws-on-error' contract is wrong; the method returns
    //      a status STRING. (The success-path literal "status" is from a prior destructive run
    //      against a real send and is NOT re-verified by this safe probe.)
    try {
        var sendId = 999999999; // obviously-invalid / non-existent Send id — nothing real cancelled
        var send = Send.Init(sendId);
        Platform.Response.Write("typeof send.CancelSend: " + typeof send.CancelSend + "\n");
        Platform.Response.Write("send.CancelSend.length (arity): " + send.CancelSend.length + "\n");
        var result = send.CancelSend();
        Platform.Response.Write("typeof result: " + typeof result + "\n");
        Platform.Response.Write("result === \"OK\": " + (result === "OK") + "\n");
        Platform.Response.Write("result === \"status\": " + (result === "status") + "\n");
        Platform.Response.Write("CancelSend result: " + Platform.Function.Stringify(result) + "\n");
    } catch (e) {
        Platform.Response.Write("ERROR: " + Platform.Function.Stringify(e) + "\n");
    }
    </script>

- name: "Subscriber.Upsert / Subscriber.Statistics"
  url: "/core-library/subscriber/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud/guide/ssjs_subscriberUpsert.html"
  tagline: "instance methods, not static"
  part: "sfmc"
  category: "Core Library"
  object: "Subscriber"
  severity: "medium"
  discrepancy: "A4"
  anchor: "subscriber-upsert-subscriber-statistics"
  body: |
    The official docs present `Subscriber.Upsert(properties)` and `Subscriber.Statistics(subscriberKey)` as **static** members of `Subscriber`. At runtime the static names are `undefined` (`typeof Subscriber.Upsert === "undefined"`, `typeof Subscriber.Statistics === "undefined"`). Both are actually **instance** methods on the object returned by `Subscriber.Init(subscriberKey)`: `<SubscriberInstance>.Upsert(properties)` and `<SubscriberInstance>.Statistics()` (the subscriber key comes from `Init`, so `Statistics` takes no argument — calling it with a non-existent key returns an object like `{"Error":"No subscriber found with the key: …"}`).
  testScript: |
    <script runat="server">
    Platform.Load("core", "1.1.5");
    // Subscriber.Upsert / Subscriber.Statistics static-vs-instance probe (NON-DESTRUCTIVE).
    // Proves the STATIC names are undefined and both live as INSTANCE methods on Subscriber.Init(key).
    // OBSERVED: static Subscriber.Upsert & Subscriber.Statistics are both `undefined`; on the instance
    // from Subscriber.Init(key), typeof sub.Upsert === "function" and typeof sub.Statistics === "function".
    // Statistics() called with no arg returns an object ({"Error":"No subscriber found with the key: …"}
    // for a throwaway key); Upsert is callable. CLAIM CONFIRMED (instance methods, not static).
    Platform.Response.Write("=== Subscriber.Upsert / Statistics probe ===\n\n");

    // Probe 1: STATIC members are undefined
    try {
        Platform.Response.Write("typeof Subscriber: " + typeof Subscriber + "\n");
        Platform.Response.Write("typeof Subscriber.Upsert (static): " + typeof Subscriber.Upsert + "\n");
        Platform.Response.Write("typeof Subscriber.Statistics (static): " + typeof Subscriber.Statistics + "\n");
        Platform.Response.Write("typeof Subscriber.Init: " + typeof Subscriber.Init + "\n");
    } catch (e) {
        Platform.Response.Write("P1 THREW -> " + (typeof e == "object" ? Platform.Function.Stringify(e) : e) + "\n");
    }
    Platform.Response.Write("\n");

    // Probe 2: INSTANCE from Subscriber.Init(key) exposes Upsert & Statistics
    try {
        var sub = Subscriber.Init("qa-throwaway-key");
        Platform.Response.Write("typeof sub (instance): " + typeof sub + "\n");
        Platform.Response.Write("typeof sub.Upsert (instance): " + typeof sub.Upsert + "\n");
        Platform.Response.Write("typeof sub.Statistics (instance): " + typeof sub.Statistics + "\n");
    } catch (e) {
        Platform.Response.Write("P2 THREW -> " + (typeof e == "object" ? Platform.Function.Stringify(e) : e) + "\n");
    }
    Platform.Response.Write("\n");

    // Probe 3: Statistics() is read-only — call with no arg and observe return shape
    try {
        var sub3 = Subscriber.Init("qa-throwaway-stats");
        var stats = sub3.Statistics();
        Platform.Response.Write("typeof stats: " + typeof stats + "\n");
        Platform.Response.Write("Stringify(stats): " + Platform.Function.Stringify(stats) + "\n");
    } catch (e) {
        Platform.Response.Write("P3 THREW -> " + (typeof e == "object" ? Platform.Function.Stringify(e) : e) + "\n");
    }
    </script>

- name: "DateTime.SystemDateToLocalDate / LocalDateToSystemDate"
  url: "/core-library/datetime/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud/guide/ssjs_dateTimeSystemDateToLocalDate.html"
  tagline: "return Date objects, not strings"
  part: "sfmc"
  category: "Core Library"
  object: "DateTime"
  severity: "medium"
  discrepancy: "A1"
  anchor: "datetime-systemdatetolocaldate-localdatetosystemdate"
  body: |
    The official docs type the Core-library `DateTime` conversion methods as returning a `string`, but at runtime `DateTime.SystemDateToLocalDate(...)` and `DateTime.LocalDateToSystemDate(...)` return genuine **`Date` objects** (`typeof "object"`, `Object.prototype.toString` reports `[object Date]`, `.constructor === Date`, and `getFullYear()` / `getHours()` / `getTime()` all work — identical to `new Date()`; only `instanceof Date` is false, due to the engine-wide `instanceof`-on-builtins bug, so test with `.constructor === Date`). They also coerce transparently to a string via `String(value)`, `"" + value`, or `Write(value)`. Separately, `DateTime.TimeZone.Retrieve()` rows are CLR objects that `Stringify()` **cannot** serialize — enumerate their fields with `for..in` instead.
  testScript: |
    <script runat="server">
    Platform.Load("core", "1.1.5");
    // OBSERVED: CONFIRMED live on CloudPage. typeof DateTime = "object"; both
    // DateTime.SystemDateToLocalDate and DateTime.LocalDateToSystemDate are "function".
    // SystemDateToLocalDate(Now()) => typeof "object" (=== null false), coerces to string
    // "Mon, 20 Jul 2026 06:47:17 GMT-06:00" via String()/(""+), getFullYear() => 2026 works
    // (genuine Date-like object, NOT a string). LocalDateToSystemDate(local) => typeof "object",
    // round-trips back to the original system Now() "Sun, 19 Jul 2026 22:47:17" (inverse, +8h offset).
    // Claim that docs type these as string but runtime returns objects coercing to string = CONFIRMED.
    Platform.Response.Write("=== DateTime conversion probe ===\n");
    Platform.Response.Write("Now: " + Platform.Function.Now() + "\n\n");

    // Probe 0: DateTime object + method existence
    try {
        Platform.Response.Write("typeof DateTime: " + typeof DateTime + "\n");
        Platform.Response.Write("typeof DateTime.SystemDateToLocalDate: " + typeof DateTime.SystemDateToLocalDate + "\n");
        Platform.Response.Write("typeof DateTime.LocalDateToSystemDate: " + typeof DateTime.LocalDateToSystemDate + "\n");
    } catch (e) {
        Platform.Response.Write("P0 THREW -> " + (typeof e == "object" ? Platform.Function.Stringify(e) : e) + "\n");
    }

    // Probe 1: SystemDateToLocalDate with a concrete Date value — observe return type
    try {
        var local = DateTime.SystemDateToLocalDate(Platform.Function.Now());
        // EXPECTED: typeof "object" (CLR DateTime), NOT "string".
        Platform.Response.Write("typeof SystemDateToLocalDate return: " + typeof local + "\n");
        Platform.Response.Write("=== null? " + (local === null) + "\n");
        // EXPECTED: coerces transparently to a string via String()/concatenation.
        Platform.Response.Write("as String(): " + String(local) + "\n");
        Platform.Response.Write("as (\"\"+): " + ("" + local) + "\n");
        try {
            Platform.Response.Write("getFullYear(): " + local.getFullYear() + "\n");
        } catch (e2) {
            Platform.Response.Write("getFullYear() THREW -> " + (typeof e2 == "object" ? Platform.Function.Stringify(e2) : e2) + "\n");
        }
    } catch (e) {
        Platform.Response.Write("P1 THREW -> " + (typeof e == "object" ? Platform.Function.Stringify(e) : e) + "\n");
    }

    // Probe 2: LocalDateToSystemDate round-trip — observe return type + inverse behaviour
    try {
        var nowSystem = Platform.Function.Now();
        var localD = DateTime.SystemDateToLocalDate(nowSystem);
        var back = DateTime.LocalDateToSystemDate(localD);
        Platform.Response.Write("typeof LocalDateToSystemDate return: " + typeof back + "\n"); // EXPECTED "object"
        Platform.Response.Write("=== null? " + (back === null) + "\n");
        Platform.Response.Write("back as String(): " + String(back) + "\n");
        Platform.Response.Write("original system Now(): " + nowSystem + "\n");
        Platform.Response.Write("local (converted): " + String(localD) + "\n");
    } catch (e) {
        Platform.Response.Write("P2 THREW -> " + (typeof e == "object" ? Platform.Function.Stringify(e) : e) + "\n");
    }
    </script>

- name: "&lt;WSProxyInstance&gt;.describe"
  url: "/wsproxy/describe/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud/guide/ssjs_WSProxy_describe.html"
  tagline: "Results elements are the ObjectDefinition itself, not a nested wrapper"
  part: "sfmc"
  category: "WSProxy"
  object: "WSProxyInstance"
  severity: "high"
  discrepancy: "A4"
  anchor: "wsproxyinstance-describe"
  body: |
    The official docs show `describe` returning `{ RequestID, Results: [{ ObjectDefinition: { Properties: [...] } }] }` — one `ObjectDefinition` wrapper per requested type. At runtime each element of `Results` **is** the object definition directly: `result.Results[0]` already carries `ObjectType`, `Name`, `Properties`, `IsCreatable`, etc., and there is **no** `Results[0].ObjectDefinition` key (`typeof` it is `undefined`). Read fields as `result.Results[0].Properties`, not `result.Results[0].ObjectDefinition.Properties` (for `Subscriber`, `Properties` is a 29-element array whose first entry's `Name` is `ID`). `objectType` accepts a single string **or** an array of strings; the returned `Results` array element order matches the input order (`describe(["List", "Subscriber"])` returns `List` then `Subscriber`). Describing an unknown object type does **not** throw — it returns `{ RequestID, Results: [null] }`, so guard against a `null` element. The return object exposes `RequestID` but no `Status` field (`typeof result.Status` is `undefined`).
  testScript: |
    <script runat="server">
    Platform.Load("core", "1.1.5");
    // Verify <WSProxyInstance>.describe() result shape (READ-ONLY metadata retrieval).
    // OBSERVED (live CloudPage): CONFIRMED. typeof api.describe = "clrmethodinfo". Single-string
    // AND array forms both accepted. Results[i] IS the object definition directly:
    // typeof Results[0].ObjectDefinition = "undefined"; Results[0].ObjectType = "Subscriber",
    // typeof Properties = "object" (array, length 29, first prop Name = "ID"), typeof IsCreatable
    // = "boolean" (Results[0].Name came back null for Subscriber, but the key exists). Unknown type
    // "NoSuchObjectType_XYZ" -> Results[1] === null (no throw). Return has RequestID (true) and no
    // Status field (typeof result.Status = "undefined"). Input order preserved: describe(["List",
    // "Subscriber"]) -> Results[0].ObjectType "List", Results[1].ObjectType "Subscriber".
    Platform.Response.Write("=== describe() verification ===\n");

    // Probe A: typeof describe and single-string form
    try {
        var api = new Script.Util.WSProxy();
        Platform.Response.Write("typeof api.describe: " + (typeof api.describe) + "\n");
        var single = api.describe("Subscriber");
        Platform.Response.Write("A single-string call ok; Results length: " + single.Results.length + "\n");
        Platform.Response.Write("A typeof single.Results[0].ObjectDefinition: " + (typeof single.Results[0].ObjectDefinition) + "\n");
        Platform.Response.Write("A single.Results[0].ObjectType: " + single.Results[0].ObjectType + "\n");
    } catch (e) {
        Platform.Response.Write("A THREW -> " + Platform.Function.Stringify(e) + "\n");
    }

    // Probe B: array form with a valid and an unknown type
    try {
        var api2 = new Script.Util.WSProxy();
        var result = api2.describe(["Subscriber", "NoSuchObjectType_XYZ"]);
        Platform.Response.Write("B Results length: " + result.Results.length + "\n");
        Platform.Response.Write("B typeof Results[0].ObjectDefinition: " + (typeof result.Results[0].ObjectDefinition) + "\n");
        Platform.Response.Write("B Results[0].ObjectType: " + result.Results[0].ObjectType + "\n");
        Platform.Response.Write("B typeof Results[0].Properties: " + (typeof result.Results[0].Properties) + "\n");
        Platform.Response.Write("B typeof Results[0].IsCreatable: " + (typeof result.Results[0].IsCreatable) + "\n");
        Platform.Response.Write("B Results[1] (unknown) === null? " + (result.Results[1] === null) + "\n");
        Platform.Response.Write("B has RequestID: " + (typeof result.RequestID != "undefined") + "\n");
        Platform.Response.Write("B typeof result.Status: " + (typeof result.Status) + "\n");
    } catch (e) {
        Platform.Response.Write("B THREW -> " + Platform.Function.Stringify(e) + "\n");
    }

    // Probe C: order matches input order (reverse pair)
    try {
        var api3 = new Script.Util.WSProxy();
        var ordered = api3.describe(["List", "Subscriber"]);
        Platform.Response.Write("C Results[0].ObjectType: " + ordered.Results[0].ObjectType + "\n");
        Platform.Response.Write("C Results[1].ObjectType: " + ordered.Results[1].ObjectType + "\n");
    } catch (e) {
        Platform.Response.Write("C THREW -> " + Platform.Function.Stringify(e) + "\n");
    }
    Platform.Response.Write("=== done ===\n");
    </script>

- name: "&lt;WSProxyInstance&gt;.performBatch"
  url: "/wsproxy/performbatch/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud/guide/ssjs_WSProxy_perform.html"
  tagline: "action verb is case-insensitive; each Results entry carries a Task sub-object"
  part: "sfmc"
  category: "WSProxy"
  object: "WSProxyInstance"
  severity: "low"
  discrepancy: "A5"
  anchor: "wsproxyinstance-performbatch"
  body: |
    The official docs list the `action` argument as `Enum('Start')` without noting case behaviour. The perform verb is **case-insensitive** — lowercase `"start"` and capitalised `"Start"` are parsed identically (both reach the same per-item processing), whereas a bogus verb is rejected with `"… is not an action that can be Performed …"`. The return object is `{ Status (string), StatusMessage (string, empty on success), RequestID (string), Results (Array, one entry per input item) }` — an empty `items` array returns `Status "OK"` with `Results.length 0`. Each `Results` entry exposes not just `StatusCode`/`StatusMessage`/`OrdinalID`/`ErrorCode` (with `ErrorCode`/`OrdinalID` as numbers) but also an `Object` wrapper (the acted-on API object) and a `Task` sub-object — per-item detail the official docs do not describe.
  testScript: |
    <script runat="server">
    Platform.Load("core", "1.1.5");
    // NON-DESTRUCTIVE verification of <WSProxyInstance>.performBatch(type, items, action).
    // Claim: action verb is case-insensitive; each Results entry carries an Object wrapper and a
    // Task sub-object. Probes use EMPTY / INVALID inputs only, so nothing real is started.
    // OBSERVED (live CloudPage): CONFIRMED. typeof performBatch = "clrmethodinfo".
    //   B (empty items, "start"): Status "OK", StatusMessage "" (string), RequestID present,
    //     Results object with length 0. C (bogus ObjectID, "start") & D (bogus ObjectID, "Start")
    //     behave IDENTICALLY -> Status "InvalidRequest", Results.length 1, Results[0].StatusCode
    //     "Error"; Results[0] carries Object (object) + Task (object) + numeric ErrorCode/OrdinalID
    //     => verb is case-insensitive AND the undocumented Object/Task per-item detail exists.
    //     E (bogus verb "definitelyNotARealVerb"): Status "Error", message "… is not an action that
    //     can be Performed on a InteractionDefinition" -> unknown verbs are rejected differently,
    //     confirming "start"/"Start" are both accepted. Nothing real ran (all ObjectIDs invalid).
    Platform.Response.Write("=== performBatch NON-DESTRUCTIVE verification ===\n");

    // Probe A: presence + arity
    try {
        var api = new Script.Util.WSProxy();
        Platform.Response.Write("A typeof api.performBatch: " + (typeof api.performBatch) + "\n");
        Platform.Response.Write("A api.performBatch.length (arity): " + api.performBatch.length + "\n");
    } catch (e) {
        Platform.Response.Write("A THREW -> " + Platform.Function.Stringify(e) + "\n");
    }

    // Probe B: EMPTY items array + lowercase "start" -- nothing to act on, so no real run.
    try {
        var apiB = new Script.Util.WSProxy();
        var rB = apiB.performBatch("QueryDefinition", [], "start");
        Platform.Response.Write("B Status: " + rB.Status + "\n"); // OBSERVED: "OK"
        Platform.Response.Write("B typeof StatusMessage: " + (typeof rB.StatusMessage) + " value=" + Platform.Function.Stringify(rB.StatusMessage) + "\n"); // OBSERVED: string ""
        Platform.Response.Write("B has RequestID: " + (typeof rB.RequestID != "undefined") + "\n"); // OBSERVED: true
