- name: "HTTP.Post"
  url: "/http/post/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud/guide/ssjs_httpPost.html"
  tagline: "header arrays optional; StatusCode is a number, Response is an array"
  part: "sfmc"
  category: "HTTP"
  object: "HTTP"
  severity: "high"
  discrepancy: "A1"
  anchor: "http-post"
  body: |
    The official docs are wrong on two counts:

    1. They list `headerNames` and `headerValues` as **required**, but at runtime a three-argument call (`url`, `contentType`, `payload`) works — the two header arrays are **optional** and only need to be paired when supplied.
    2. They type `StatusCode` as a **string** and `Response` as a single **string**, but at runtime the call returns an object whose `StatusCode` is a **number** and whose `Response` is an **array** — the body is `Response[0]`. (Note the field names differ from `HTTP.Get`, which returns `{ Status, Content }`.)
  testScript: |
    <script runat="server">
    Platform.Load("core", "1.1.5");
    // OBSERVED (live CloudPage POST to postman-echo.com): B1 3-arg call (headers omitted) succeeded StatusCode 200; return keys = [StatusCode,Response]; typeof StatusCode = "number"; Response is an ARRAY ([object Array], length 1) whose Response[0] is the string body; B2 5-arg call echoed the supplied custom header back (present=true). Claim CONFIRMED: header arrays optional; StatusCode number; Response array.
    var url = "https://postman-echo.com/post";
    // B1: three-argument HTTP.Post(url, contentType, payload) - header arrays OMITTED.
