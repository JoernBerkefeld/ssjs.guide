    Platform.Load("core", "1.1.5");
    // OBSERVED (SFMC CloudPage, live): "a1b2".match(/\d/) => ["1"] (length 1, no .index); "abc".match(/\d/) => [] (empty array, NOT null). VERDICT: CONFIRMED.
