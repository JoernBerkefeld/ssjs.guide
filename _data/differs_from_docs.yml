- name: "Request (bare-name global)"
  url: "/core-library/request/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud/guide/ssjs_utilitiesRequestObject.html"
  tagline: "more reliable than Platform.Request"
  part: "sfmc"
