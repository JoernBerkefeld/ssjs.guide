    } catch (e) { Platform.Response.Write("ERROR: " + Platform.Function.Stringify(e) + "\n"); }
    </script>

- name: "Platform.Function.ContentArea"
  url: "/platform-functions/contentarea/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud/guide/ssjs_platformContentContentArea.html"
  tagline: "no SSJS call shape works"
  part: "sfmc"
  category: "Platform Functions"
  object: "Platform.Function"
  severity: "medium"
  discrepancy: "A7"
  anchor: "platform-function-contentarea-no-working-call-shape"
  body: |
    **No arity returns a value.** The docs present `ContentArea(id, regionName, stopOnError, fallbackContent)` as an ordinary callable returning the area's rendered markup, with `stopOnError: false` letting a failed call proceed and `fallbackContent` displayed when nothing comes back. At runtime:

    - **Arity 1** throws `An error occurred when attempting to evaluate an ContentArea function call.` — for a bogus id *and* for the numeric id of a Content Area that a WSProxy `retrieve` proved exists in the same business unit, so a missing area is not the cause.
    - **Arity 2–4** throw a *different*, resolved-value error (`… must be a literal (constant) values.`, `Parameter Name: ImpressionRegionName`, `Parameter Ordinal: 2`, `Parameter Type: ResolvedValueParameter`) for every `regionName` shape — string literal, concatenation, variable, empty string and `null` alike. Because parameter 2 is rejected outright, **`stopOnError` and `fallbackContent` are unreachable and the fallback string is never emitted**.
    - **Arity 0 and 5+** throw the overloaded `Unable to retrieve security descriptor for this frame.`

    **Core-library equivalent:** [`ContentArea()`](/core-library/contentarea/) is a genuine function after `Platform.Load("core", …)` (`typeof` is `"function"`, not the phantom `"clrmethodinfo"`), but it is no escape hatch — arity 1 and 2 throw identically, and its arity 3–5 forms throw the security-descriptor error, so its `errorMsg` parameter is unreachable too.

    Classic Content Areas are deprecated; use [`Platform.Function.ContentBlockByID()`](/platform-functions/contentblockbyid/) instead.
  testScript: |
    <script runat="server">
    Platform.Load("core","1.1.5");
    // NOTE: these CLR exception messages cannot be inspected with .length /
    // .indexOf / .substring - those abort the CloudPage with HTTP 422.
    function attempt(id, fn) {
      try { fn(); Platform.Response.Write(id + ": did NOT throw\n"); }
      catch (e) { Platform.Response.Write(id + ": threw: " + e.message + "\n"); }
    }
    // Resolve a Content Area that genuinely exists in this business unit.
    var realId = 0;
    var prox = new Script.Util.WSProxy();
    var res = prox.retrieve("ContentArea", ["ID","Name"], null);
    if (res.Results && res.Results.length > 0) { realId = res.Results[0].ID; }
    Platform.Response.Write("a real Content Area id exists: " + (realId > 0) + "\n");
    attempt("arity 1, real existing id", function () { return Platform.Function.ContentArea(realId); });
    attempt("arity 1, bogus id", function () { return Platform.Function.ContentArea(123456); });
    // OBSERVED: both throw "An error occurred when attempting to evaluate an ContentArea function call."
    attempt("arity 2, regionName literal", function () { return Platform.Function.ContentArea(123456, "impressionRegion"); });
    attempt("arity 2, regionName null", function () { return Platform.Function.ContentArea(123456, null); });
    attempt("arity 3, stopOnError false", function () { return Platform.Function.ContentArea(123456, "impressionRegion", false); });
    attempt("arity 4, with fallbackContent", function () { return Platform.Function.ContentArea(123456, "impressionRegion", false, "FALLBACK"); });
    // OBSERVED: all four throw the ImpressionRegionName / ResolvedValueParameter error,
    // so stopOnError and fallbackContent never take effect.
    attempt("arity 0", function () { return Platform.Function.ContentArea(); });
    attempt("arity 5", function () { return Platform.Function.ContentArea(123456, "reg", false, "fb", "extra"); });
    // OBSERVED: both throw "Unable to retrieve security descriptor for this frame."
    attempt("bare-name arity 1", function () { return ContentArea(123456); });
    // OBSERVED: throws identically - the Core form is no escape hatch.
    </script>

- name: "Platform.Function.ContentAreaByName"
  url: "/platform-functions/contentareabyname/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud/guide/ssjs_platformContentContentAreaByName.html"
  tagline: "no SSJS call shape works"
  part: "sfmc"
  category: "Platform Functions"
  object: "Platform.Function"
  severity: "medium"
  discrepancy: "A7"
  anchor: "platform-function-contentareabyname-no-working-call-shape"
  body: |
    **No arity returns a value.** The docs present `ContentAreaByName(name, regionName, stopOnError, fallbackContent)` as an ordinary callable returning the area's rendered markup, with `stopOnError: false` letting a failed call proceed and `fallbackContent` displayed when nothing comes back. At runtime:

    - **Arity 1** throws `An error occurred when attempting to evaluate a ContentAreaByName function call.` for every name shape — folder-path notation, a bare name and the empty string alike — while a WSProxy `retrieve` of the `ContentArea` SOAP object proves an area exists in the same business unit, so an empty account is not the cause.
    - **Arity 2–4** throw a *different*, resolved-value error (`… must be a literal (constant) values.`, `Parameter Name: ImpressionRegionName`, `Parameter Ordinal: 2`, `Parameter Type: ResolvedValueParameter`) for every `regionName` shape — string literal, concatenation, variable, empty string and `null` alike. Because parameter 2 is rejected outright, **`stopOnError` and `fallbackContent` are unreachable and the fallback string is never emitted**.
    - **Arity 0 and 5+** throw the overloaded `Unable to retrieve security descriptor for this frame.`

    **Core-library equivalent:** [`ContentAreaByName()`](/core-library/contentareabyname/) is a genuine function after `Platform.Load("core", …)` (`typeof` is `"function"`, not the phantom `"clrmethodinfo"`), but it is no escape hatch — arity 1 and 2 throw identically, and its arity 3–5 forms throw the security-descriptor error, so its `errorMsg` parameter is unreachable too.

    Classic Content Areas are deprecated; use [`Platform.Function.ContentBlockByName()`](/platform-functions/contentblockbyname/) instead.
  testScript: |
    <script runat="server">
    Platform.Load("core","1.1.5");
    // NOTE: these CLR exception messages cannot be inspected with .length /
    // .indexOf / .substring - those abort the CloudPage with HTTP 422.
    function attempt(id, fn) {
      try { fn(); Platform.Response.Write(id + ": did NOT throw\n"); }
      catch (e) { Platform.Response.Write(id + ": threw: " + e.message + "\n"); }
    }
    // A Content Area genuinely exists in this business unit.
    var prox = new Script.Util.WSProxy();
    var res = prox.retrieve("ContentArea", ["ID","Name"], null);
    var found = res.Results && res.Results.length > 0;
    Platform.Response.Write("a real Content Area exists: " + found + "\n");
    attempt("arity 1, folder-path name", function () { return Platform.Function.ContentAreaByName("My Content\\myContentArea"); });
    attempt("arity 1, bare name", function () { return Platform.Function.ContentAreaByName("myContentArea"); });
    attempt("arity 1, empty string", function () { return Platform.Function.ContentAreaByName(""); });
    // OBSERVED: all three throw "An error occurred when attempting to evaluate a ContentAreaByName function call."
    attempt("arity 2, regionName literal", function () { return Platform.Function.ContentAreaByName("My Content\\myContentArea", "impressionRegion"); });
    attempt("arity 2, regionName null", function () { return Platform.Function.ContentAreaByName("My Content\\myContentArea", null); });
    attempt("arity 3, stopOnError false", function () { return Platform.Function.ContentAreaByName("My Content\\myContentArea", "impressionRegion", false); });
    attempt("arity 4, with fallbackContent", function () { return Platform.Function.ContentAreaByName("My Content\\myContentArea", "impressionRegion", false, "FALLBACK"); });
    // OBSERVED: all four throw the ImpressionRegionName / ResolvedValueParameter error,
    // so stopOnError and fallbackContent never take effect.
    attempt("arity 0", function () { return Platform.Function.ContentAreaByName(); });
    attempt("arity 5", function () { return Platform.Function.ContentAreaByName("a", "reg", false, "fb", "extra"); });
    // OBSERVED: both throw "Unable to retrieve security descriptor for this frame."
    attempt("bare-name arity 1", function () { return ContentAreaByName("My Content\\myContentArea"); });
    attempt("bare-name arity 3, string errorMsg", function () { return ContentAreaByName("My Content\\myContentArea", "impressionRegion", "err"); });
    // OBSERVED: throws identically - the Core form is no escape hatch.
    </script>

- name: "Platform.Function.ContentBlockByID"
  url: "/platform-functions/contentblockbyid/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud/guide/ssjs_platformContentContentBlockByID.html"
  tagline: "only the single-argument form works from SSJS"
  part: "sfmc"
  category: "Platform Functions"
  object: "Platform.Function"
  severity: "medium"
  discrepancy: "A7"
  anchor: "platform-function-contentblockbyid-only-one-argument-works"
  body: |
    **Only the 1-argument form works from SSJS.** The docs show `Platform.Function.ContentBlockByID(12345,"impressionRegion",false,"defaultContentHere")` as ordinary working SSJS. At runtime:

    - **Arity 1** works and returns the block's rendered body. The `id` may be a number, a numeric string or a variable — there is no literal restriction on the single-argument form.
    - **Arity 2–4** throw `A ContentBlockByID function call includes an invalid parameter value. … must be a literal (constant) values.` naming `Parameter Name: ImpressionRegionName`, `Parameter Ordinal: 2`, `Parameter Type: ResolvedValueParameter` — for a **string literal**, a number, a boolean, the empty string, `null` and a variable alike. This is therefore **not** a literal-vs-variable rule: the second parameter cannot be supplied from SSJS at all, which makes `stopOnError` and `fallbackContent` unreachable and the fallback string is never emitted.
    - **Arity 0 and 5+** throw the overloaded `Unable to retrieve security descriptor for this frame.`, as does passing the asset's **external key** instead of its numeric id.
    - **No bare-name Core form exists:** `typeof ContentBlockByID` is `"undefined"` even after `Platform.Load("core", …)`, and invoking it throws `Object expected: ContentBlockByID`.

    **The platform is not at fault — the SSJS binding is.** The AMPscript function of the same name honours all four parameters. Invoked through `Platform.Function.TreatAsContent()` in the very same request, a named impression region returns the body, `fallbackContent` is returned for a missing block, `stopOnError: true` propagates the error and `stopOnError: false` without a fallback yields the empty string. Use that as the **workaround** whenever an optional parameter is needed.

