    } catch (e) { Platform.Response.Write("defineProperty CALL THREW -> " + Platform.Function.Stringify(e) + "\n"); }
    try {
      Platform.Response.Write("Object.getPrototypeOf CALL, typeof result = " + (typeof Object.getPrototypeOf({})) + "\n");
