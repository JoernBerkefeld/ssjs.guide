  anchor: "senderprofile-add"
  body: |
    The official docs annotate `SenderProfile.Add(properties)` as returning the string `"OK"`. Runtime-verified on a live CloudPage: it returns a **CLR object** (`typeof` is `clr`; it stringifies to `ExactTarget.Integration.WSDL.SenderProfile`), not `"OK"`. Reading any property off it throws *"Use of Common Language Runtime (CLR) is not allowed"*, so the object is opaque from SSJS — treat any non-throwing return as success. This mirrors `DeliveryProfile.Add`. Sibling instance methods `<SenderProfileInstance>.Update(properties)` and `<SenderProfileInstance>.Remove()` return the string `"OK"` as documented; `SenderProfile.Init` binds a key and returns a working instance.

- name: "DataExtension.Retrieve"
  url: "/core-library/dataextension/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud/guide/ssjs_dataExtensionRetrieve.html"
  tagline: "filter is optional at runtime"
  part: "sfmc"
  category: "Core Library"
  object: "DataExtension"
  severity: "medium"
  discrepancy: "A3"
  anchor: "dataextension-retrieve"
  body: |
    The official docs list the `filter` argument as **required**, but at runtime it is **optional**: calling `DataExtension.Retrieve()` with no arguments does not throw — it returns the full list of data extensions. A filter that matches nothing returns a **real empty array** (`Object.prototype.toString` reports `[object Array]`, `typeof .length` is `number`, `.length === 0`, zero enumerable keys) — not `null` and not `undefined`. Note the SFMC engine quirk that an empty array is **falsy** here, so guard on `.length` (`results.length > 0`) rather than truthiness of the array itself.

- name: "&lt;DataExtensionInstance&gt;.Rows.Add / Update"
  url: "/core-library/dataextension-rows/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud/guide/ssjs_dataExtensionRowsAdd.html"
  tagline: "return a row count, not \"OK\""
  part: "sfmc"
  category: "Core Library"
  object: "DataExtensionInstance"
  severity: "medium"
  discrepancy: "A1"
  anchor: "dataextensioninstance-rows-add-update"
  body: |
    The official docs annotate `<DataExtensionInstance>.Rows.Add(rowData)` and `<DataExtensionInstance>.Rows.Update(rowData, whereFieldNames, whereValues)` as returning the string `"OK"`. At runtime both return a **number** — the count of rows added / updated. `Update` returns **`0` and does not throw** when the WHERE clause matches no rows (the docs imply it throws). `Add` also accepts a **single row object** in addition to an array of objects.

- name: "&lt;DataExtensionInstance&gt;.Rows.Retrieve / Lookup"
  url: "/core-library/dataextension-rows/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud/guide/ssjs_dataExtensionRowsRetrieve.html"
  tagline: "string vs typed values, empty-array vs null, and Retrieve works on CloudPages"
  part: "sfmc"
  category: "Core Library"
  object: "DataExtensionInstance"
  severity: "high"
  discrepancy: "A1"
  anchor: "dataextensioninstance-rows-retrieve-lookup"
  body: |
    Runtime-verified on a live CloudPage:

    1. `<DataExtensionInstance>.Rows.Retrieve()` **without a filter DOES work on CloudPages** and returns all rows — the widely-repeated "returns empty on CloudPages" bug could not be reproduced.
    2. `Retrieve` returns **every field value as a string** (even Number/Boolean/Date columns); `Lookup` returns **typed values**.
    3. On no match, `Retrieve` returns an **empty array** (`.length === 0`) while `Lookup` returns **`null`**.
    4. Both `Retrieve` and `Lookup` results are **host arrays**: `Object.prototype.toString` reports `[object Array]` and `.length` / index access work, but `instanceof Array` is `false`.

- name: "&lt;DataExtensionInstance&gt;.Fields.Retrieve"
  url: "/core-library/dataextension-fields/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud/guide/ssjs_dataExtensionFieldsRetrieve.html"
  tagline: "field objects include an undocumented ObjectID"
  part: "sfmc"
  category: "Core Library"
  object: "DataExtensionInstance"
  severity: "low"
  discrepancy: "A5"
  anchor: "dataextensioninstance-fields-retrieve"
  body: |
    The official docs example response lists only `Name`, `FieldType`, `IsPrimaryKey`, `MaxLength`, `Ordinal`, and `DefaultValue`. At runtime each returned field object also carries an undocumented **`ObjectID`** (`string`) property. The collection is a genuine JS `Array` (`[object Array]`). Sibling methods `<DataExtensionInstance>.Fields.Add` and `<DataExtensionInstance>.Fields.UpdateSendableField` return the string `"OK"` on success and the string `"Error"` on failure — they do **not** throw, contrary to the docs' "throws on failure" wording.

- name: "FilterDefinition.Add / Update / Remove"
  url: "/core-library/filterdefinition/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud/guide/ssjs_filterDefinitionAdd.html"
  tagline: "return \"Error\", do not throw on failure"
  part: "sfmc"
  category: "Core Library"
  object: "FilterDefinition"
  severity: "medium"
  discrepancy: "A1"
  anchor: "filterdefinition-add-update-remove"
  body: |
    The official docs state these return `"OK"` on success or throw on failure. At runtime, on failure they return the plain string **`"Error"`** and do **not** throw. Their success path is **BLOCKED** for verification — a valid `FilterDefinition` could not be created on the test BU (creating one requires an audience/DataSource configuration the test account could not satisfy; every `Add` attempt with SubscriberList and DataExtension DataSources returned `"Error"`, and a direct WSProxy `createItem("FilterDefinition")` throws a SOAP inner exception *"Invalid property name: Type"* on `DataSource`). Treat a non-`"OK"` return as failure rather than relying on a thrown exception.

- name: "&lt;SendInstance&gt;.Tracking click & interval retrieval"
  url: "/core-library/send/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud/guide/ssjs_sendTrackingClicksRetrieve.html"
  tagline: "Clicks.Retrieve / TotalByInterval.Retrieve, not ClickRetrieve / TotalByIntervalRetrieve"
  part: "sfmc"
  category: "Core Library"
  object: "SendInstance"
  severity: "medium"
  discrepancy: "A4"
  anchor: "sendinstance-tracking-click-interval-retrieval"
  body: |
    The official docs document per-send tracking as `<SendInstance>.Tracking.ClickRetrieve(filter)` and `<SendInstance>.Tracking.TotalByIntervalRetrieve(type, startDate, endDate, groupBy)`. At runtime both of those names are `undefined`. The instance `Tracking` property is an object exposing two **sub-objects** — `Clicks` and `TotalByInterval` — each with a `Retrieve` method. The working calls are `<SendInstance>.Tracking.Clicks.Retrieve(filter)` and `<SendInstance>.Tracking.TotalByInterval.Retrieve(type, startDate, endDate, groupBy)`. This mirrors the `TriggeredSend.Tracking.Clicks` / `TriggeredSend.Tracking.TotalByInterval` shape. The static `Send.Tracking.Retrieve(filter)` (no `Send.Init` required) is unaffected.

- name: "&lt;SendInstance&gt;.CancelSend"
  url: "/core-library/send/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud/guide/ssjs_sendCancelSend.html"
  tagline: "returns \"status\", not \"OK\""
  part: "sfmc"
  category: "Core Library"
  object: "SendInstance"
  severity: "medium"
  discrepancy: "A1"
  anchor: "sendinstance-cancelsend"
  body: |
    The official docs describe `<SendInstance>.CancelSend()` as returning `"OK"` on success, but at runtime it returns the literal string **`"status"`** (runtime-verified on a live CloudPage — the send was cancelled successfully). Do not compare its return value against `"OK"`; treat any non-throwing return as success.

- name: "Subscriber.Upsert / Subscriber.Statistics"
  url: "/core-library/subscriber/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud/guide/ssjs_subscriberUpsert.html"
  tagline: "instance methods, not static"
  part: "sfmc"
  category: "Core Library"
  object: "Subscriber"
  severity: "medium"
  discrepancy: "A4"
  anchor: "subscriber-upsert-subscriber-statistics"
  body: |
    The official docs present `Subscriber.Upsert(properties)` and `Subscriber.Statistics(subscriberKey)` as **static** members of `Subscriber`. At runtime the static names are `undefined` (`typeof Subscriber.Upsert === "undefined"`, `typeof Subscriber.Statistics === "undefined"`). Both are actually **instance** methods on the object returned by `Subscriber.Init(subscriberKey)`: `<SubscriberInstance>.Upsert(properties)` and `<SubscriberInstance>.Statistics()` (the subscriber key comes from `Init`, so `Statistics` takes no argument).

- name: "DateTime.SystemDateToLocalDate / LocalDateToSystemDate"
  url: "/core-library/datetime/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud/guide/ssjs_dateTimeSystemDateToLocalDate.html"
  tagline: "return CLR DateTime objects, not strings"
  part: "sfmc"
  category: "Core Library"
  object: "DateTime"
  severity: "medium"
  discrepancy: "A1"
  anchor: "datetime-systemdatetolocaldate-localdatetosystemdate"
  body: |
    The official docs type the Core-library `DateTime` conversion methods as returning a `string`, but at runtime `DateTime.SystemDateToLocalDate(...)` and `DateTime.LocalDateToSystemDate(...)` return **CLR `DateTime` objects** (`typeof "object"`) that coerce transparently to a string via `String(value)`, `"" + value`, or `Write(value)`. Separately, `DateTime.TimeZone.Retrieve()` rows are CLR objects that `Stringify()` **cannot** serialize — enumerate their fields with `for..in` instead.

- name: "&lt;WSProxyInstance&gt;.describe"
  url: "/wsproxy/describe/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud/guide/ssjs_WSProxy_describe.html"
  tagline: "Results elements are the ObjectDefinition itself, not a nested wrapper"
  part: "sfmc"
  category: "WSProxy"
  object: "WSProxyInstance"
  severity: "high"
  discrepancy: "A4"
  anchor: "wsproxyinstance-describe"
  body: |
    The official docs show `describe` returning `{ RequestID, Results: [{ ObjectDefinition: { Properties: [...] } }] }` — one `ObjectDefinition` wrapper per requested type. At runtime each element of `Results` **is** the object definition directly: `result.Results[0]` already carries `ObjectType`, `Name`, `Properties`, `IsCreatable`, etc., and there is **no** `Results[0].ObjectDefinition` key (it is `undefined`). Read fields as `result.Results[0].Properties`, not `result.Results[0].ObjectDefinition.Properties`. `objectType` accepts a single string **or** an array of strings; the returned `Results` array element order matches the input order. Describing an unknown object type does **not** throw — it returns `{ RequestID, Results: [null] }`, so guard against a `null` element. The return object exposes `RequestID` but no `Status` field.

- name: "&lt;WSProxyInstance&gt;.performBatch"
  url: "/wsproxy/performbatch/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud/guide/ssjs_WSProxy_perform.html"
  tagline: "action verb is case-insensitive; each Results entry carries a Task sub-object"
  part: "sfmc"
  category: "WSProxy"
  object: "WSProxyInstance"
  severity: "low"
  discrepancy: "A5"
  anchor: "wsproxyinstance-performbatch"
  body: |
    The official docs list the `action` argument as `Enum('Start')` without noting case behaviour. Runtime-verified against a freshly-created active `QueryDefinition`: both `"Start"` and lowercase `"start"` return `Status` `"OK"` with `Results[0].StatusMessage` `"QueryDefinition perform called successfully"` — the perform verb is **case-insensitive**. The return object is `{ Status (string), StatusMessage (string, empty on success), RequestID (string), Results (Array, one entry per input item) }`, and each `Results` entry exposes not just `StatusCode`/`StatusMessage`/`OrdinalID`/`ErrorCode` but also an `Object` wrapper (the acted-on API object) and a `Task` sub-object carrying `StatusCode`, `StatusMessage`, and `InteractionObjectID` — per-item detail the official docs do not describe.

- name: "&lt;WSProxyInstance&gt;.performItem"
  url: "/wsproxy/performitem/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud/guide/ssjs_WSProxy_perform.html"
  tagline: "action verb is case-insensitive; the single Results entry carries a Task sub-object"
  part: "sfmc"
  category: "WSProxy"
  object: "WSProxyInstance"
  severity: "low"
  discrepancy: "A5"
  anchor: "wsproxyinstance-performitem"
  body: |
    The official docs list the `action` argument as `Enum('Start')` without noting case behaviour. Runtime-verified against a freshly-created active `QueryDefinition`: both `"Start"` and lowercase `"start"` return `Status` `"OK"` with `Results[0].StatusMessage` `"QueryDefinition perform called successfully"` — the perform verb is **case-insensitive**, so this page's earlier "lowercase `\"start\"` fails" claim was wrong. The return object is `{ Status (string), StatusMessage (string, empty on success), RequestID (string), Results (Array with a single entry for the acted-on item) }`, and that `Results` entry exposes not just `StatusCode`/`StatusMessage`/`OrdinalID`/`ErrorCode` but also an `Object` wrapper (the acted-on API object) and a `Task` sub-object carrying `StatusCode`, `StatusMessage`, and `InteractionObjectID` — per-item detail the official docs do not describe. This mirrors the sibling [`performBatch`](/wsproxy/performbatch/).

- name: "&lt;WSProxyInstance&gt;.setClientId"
  url: "/wsproxy/setclientid/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud/guide/ssjs_WSProxy_impersonate.html"
  tagline: "returns null, not void"
  part: "sfmc"
  category: "WSProxy"
  object: "WSProxyInstance"
  severity: "medium"
  discrepancy: "A1"
  anchor: "wsproxyinstance-setclientid"
  body: |
    The official docs type the return as `void`, but at runtime `setClientId(options)` returns a genuine JS `null` (`typeof "object"`, strict `=== null` is `true`), not `undefined` — matching its sibling `resetClientIds`. The impersonation itself is runtime-verified on a live CloudPage: after `setClientId({ ID: <otherBU> })` the very next `retrieve` runs in the target ClientId's context (a request for a BU the caller cannot access is rejected with *"MemberID … does not have access to ClientID …"*, proving the context switched), and after `resetClientIds()` the baseline BU context is restored. The single argument is an **object** (`{ ID, UserID }`) — this page's earlier Parameters table wrongly typed it as a `number`.

- name: "&lt;WSProxyInstance&gt;.resetClientIds"
  url: "/wsproxy/resetclientids/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud/guide/ssjs_WSProxy_impersonate_clear.html"
  tagline: "returns null, not void"
  part: "sfmc"
  category: "WSProxy"
  object: "WSProxyInstance"
  severity: "medium"
  discrepancy: "A1"
  anchor: "wsproxyinstance-resetclientids"
  body: |
    The official docs type the return as `void`, but at runtime `resetClientIds()` returns a genuine JS `null` (`typeof "object"`, strict `=== null` is `true`), not `undefined`. The method itself works as documented: runtime-verified on a live CloudPage, a retrieve after `setClientId({ ID: <otherBU> })` targets the impersonated BU, and after `resetClientIds()` the very next retrieve returns to the script's own default BU context (identical result set to the pre-impersonation baseline).
- name: "Date.prototype.getMilliseconds()"
  url: "/ecmascript-builtins/date-methods/#getmilliseconds"
  officialUrl: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Date/getMilliseconds"
  tagline: "off-by-one for some values"
  part: "ecmascript"
  category: "ECMAScript Builtins"
  object: "Date"
  severity: "medium"
  discrepancy: "A1"
  anchor: "dateprototypegetmilliseconds-off-by-one-for-some-values"
  body: |
    MDN specifies `getMilliseconds()` returns the exact milliseconds (0–999) of the date. In the SFMC Jint engine some values come back **one less than they were set**: a date constructed with 123 ms reports **122**; 555 → 554, 666 → 665, 777 → 776 (runtime-verified). Other values (0, 111, 888, 999) are exact. Never compare sub-second precision — round or avoid milliseconds.
- name: "Date.now()"
  url: "/ecmascript-builtins/date-methods/#now"
  officialUrl: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Date/now"
  tagline: "returns a Date object, not a number"
  part: "ecmascript"
  category: "ECMAScript Builtins"
  object: "Date"
  severity: "medium"
  discrepancy: "A1"
  anchor: "datenow-returns-a-date-object-not-a-number"
  body: |
    MDN specifies `Date.now()` as a **static method that returns a Number** (milliseconds since the epoch). In the SFMC Jint engine it instead returns a **`Date` object** (`typeof Date.now()` is `"object"`; it stringifies to a date-time string). Numeric coercion (`Date.now() + 0` or `Date.now() * 1`) recovers the epoch milliseconds, but any code that treats the return value as a number without coercion will break. Prefer `new Date().getTime()`, which returns a clean `number`.
- name: "Date.parse()"
  url: "/ecmascript-builtins/date-methods/#parse"
  officialUrl: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Date/parse"
  tagline: "returns 0 (never NaN) for invalid strings, and parses date-only strings as local"
  part: "ecmascript"
  category: "ECMAScript Builtins"
  object: "Date"
  severity: "high"
  discrepancy: "A1"
  anchor: "dateparse-returns-0-never-nan-for-invalid-strings-and-parses-date-only-strings-as-local"
  body: |
    MDN specifies that `Date.parse()` returns **`NaN`** when the string cannot be parsed, and that **date-only** ISO forms (`"2026-06-18"`) are interpreted as **UTC**. In the SFMC engine both differ: an unparseable or invalid string (`"garbage"`, `""`, `"2021-13-45"`) returns **`0`** — the Unix epoch — so `isNaN()` cannot detect a bad date and invalid input silently becomes 1970-01-01; and a date-only string is parsed as **local** midnight (`getUTCHours()` = 6 at GMT-06:00), not UTC. Validate input explicitly; do not rely on `NaN` for error detection.
- name: "Date.UTC()"
  url: "/ecmascript-builtins/date-methods/#utc"
  officialUrl: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Date/UTC"
  tagline: "year-only form returns a nonsense value, not NaN"
  part: "ecmascript"
  category: "ECMAScript Builtins"
  object: "Date"
  severity: "medium"
  discrepancy: "A1"
  anchor: "dateutc-year-only-form-returns-a-nonsense-value-not-nan"
  body: |
    With year + month (and further components) `Date.UTC()` returns the correct UTC timestamp. But the **year-only** form `Date.UTC(2026)` returns a nonsense small number (observed **-21597974**) instead of a valid timestamp — and does not return `NaN`. Always pass at least year and month, e.g. `Date.UTC(2026, 0, 1)`.
- name: "Function.prototype.toString()"
  url: "/ecmascript-builtins/function-methods/#tostring"
  officialUrl: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Function/toString"
  tagline: "returns \"[object Function]\", not source"
  part: "ecmascript"
  category: "ECMAScript Builtins"
  object: "Function"
  severity: "medium"
  discrepancy: "A1"
  anchor: "functionprototypetostring-returns-object-function-not-source"
  body: |
    MDN specifies that `fn.toString()` returns a string containing the **function source code**. In the SFMC Jint engine it instead returns the generic **`[object Function]`** object tag (runtime-verified). `String(fn)` and `("" + fn)` yield `"function"` rather than the source. Do not rely on reading a function's source at runtime for introspection or hashing.
- name: "Function.prototype.constructor identity is broken"
  url: "/ecmascript-builtins/function-methods/#constructor"
  officialUrl: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Function/constructor"
  tagline: ""
  part: "ecmascript"
  category: "ECMAScript Builtins"
  object: "Function"
  severity: "medium"
  discrepancy: "B3"
  anchor: "functionprototypeconstructor-identity-is-broken"
  body: |
    MDN specifies that a function's `constructor` is the `Function` object, so `fn.constructor === Function` is `true`. In the SFMC engine `fn instanceof Function` is `true` (as expected) but `fn.constructor === Function` is **`false`** — the constructor-identity link is broken. Test "is this a function" with `instanceof Function` (or `typeof fn === "function"`), never with a `fn.constructor === Function` comparison.
- name: "Number constants"
  url: "/ecmascript-builtins/number-methods/#constants"
  officialUrl: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Number"
  tagline: "every Number static/constant is undefined"
  part: "ecmascript"
  category: "ECMAScript Builtins"
  object: "Number"
  severity: "medium"
  discrepancy: "B2"
  anchor: "number-constants-undefined"
  body: |
    MDN specifies the classic ES3 `Number` constants (`Number.MAX_VALUE`, `Number.MIN_VALUE`, `Number.NaN`, `Number.POSITIVE_INFINITY`, `Number.NEGATIVE_INFINITY`) as always-present static properties. In the SFMC Jint engine **all of them are `undefined`** (runtime-verified), along with the ES6 statics (`Number.isInteger`, `Number.isNaN`, `Number.MAX_SAFE_INTEGER`, `Number.EPSILON`, …). Use the global `NaN`/`Infinity` identifiers or numeric literals instead. Note the global `Infinity` is itself unreliable — see Known Bugs.
- name: "Number.prototype.toString(radix)"
  url: "/ecmascript-builtins/number-methods/#tostring"
  officialUrl: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Number/toString"
  tagline: "only 2, 8, 10, 16 supported"
  part: "ecmascript"
  category: "ECMAScript Builtins"
  object: "Number"
  severity: "low"
  discrepancy: "B1"
  anchor: "numberprototypetostring-radix"
  body: |
    MDN specifies `Number.prototype.toString(radix)` accepts any radix from **2 to 36**. In the SFMC Jint engine only radix **2, 8, 10, and 16** work — every other base throws `"Invalid Base."` (runtime-verified). Fractional values are also truncated to their integer part before non-decimal conversion (`(3.5).toString(2)` → `"100"`, not `"11.1"`). Restrict `toString` radix conversions to those four bases.
- name: "Number.prototype.toExponential()"
  url: "/ecmascript-builtins/number-methods/#toexponential"
  officialUrl: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Number/toExponential"
  tagline: "no-arg form pads trailing zeros"
  part: "ecmascript"
  category: "ECMAScript Builtins"
  object: "Number"
  severity: "low"
  discrepancy: "B1"
  anchor: "numberprototypetoexponential-noarg"
  body: |
    MDN specifies that `toExponential()` with no argument uses the minimal number of digits needed to represent the value. In the SFMC Jint engine the no-arg form instead pads the significand with trailing zeros (`(3.14159).toExponential()` → `"3.1415900000000000e+0"`). Always pass an explicit `fractionDigits` argument for predictable output.
- name: "Object.prototype.isPrototypeOf"
  url: "/ecmascript-builtins/object-methods/#isprototypeof"
  officialUrl: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/isPrototypeOf"
  tagline: "exists but hangs the engine"
  part: "ecmascript"
  category: "ECMAScript Builtins"
  object: "Object"
  severity: "high"
  discrepancy: "B3"
  anchor: "objectprototypeisprototypeof-hangs"
  body: |
    MDN specifies `isPrototypeOf` as a normal `Object.prototype` method that returns a boolean. In the SFMC Jint engine the method is present (`typeof` is `"function"`) but **calling it hangs the engine** — the request times out and no output is produced (runtime-verified). Never call it; compare `obj.constructor === Ctor` instead. See also [Known Bugs](/engine-limitations/known-bugs/#objectprototypeisprototypeof-hangs).
- name: "Object.prototype.propertyIsEnumerable"
  url: "/ecmascript-builtins/object-methods/#propertyisenumerable"
  officialUrl: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/propertyIsEnumerable"
  tagline: "always returns false"
  part: "ecmascript"
  category: "ECMAScript Builtins"
  object: "Object"
  severity: "medium"
  discrepancy: "B3"
  anchor: "objectprototypepropertyisenumerable-broken"
  body: |
    MDN specifies `propertyIsEnumerable(prop)` returns `true` for an own enumerable property. In the SFMC Jint engine it is present but **broken — it returns `false` even for own enumerable properties** (runtime-verified). Use `hasOwnProperty` for own-property checks instead.
- name: "Object ES5/ES6 statics"
  url: "/ecmascript-builtins/object-methods/"
  officialUrl: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object"
  tagline: "most are missing"
  part: "ecmascript"
  category: "ECMAScript Builtins"
  object: "Object"
  severity: "medium"
  discrepancy: "B2"
  anchor: "object-statics-missing"
  body: |
    MDN documents a large set of `Object` statics. In the SFMC Jint engine only `Object.defineProperty` and `Object.getPrototypeOf` are present and working — **`keys`, `values`, `entries`, `assign`, `create`, `freeze`, `isFrozen`, `defineProperties`, `getOwnPropertyNames`, `getOwnPropertyDescriptor`, `seal`, `isSealed`, `preventExtensions`, and `isExtensible` are all `undefined`** (runtime-verified). Use a `for...in` loop with `hasOwnProperty` for key/value enumeration; there is no runtime immutability or extensibility control. See [Object Methods](/ecmascript-builtins/object-methods/) for per-member workarounds.
- name: "RegExp instanceof is always false"
  url: "/ecmascript-builtins/regular-expressions/#instanceof"
  officialUrl: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/RegExp"
  tagline: "use .constructor === RegExp"
  part: "ecmascript"
  category: "ECMAScript Builtins"
  object: "RegExp"
  severity: "medium"
  discrepancy: "B3"
  anchor: "regexp-instanceof-broken"
  body: |
    MDN specifies that `re instanceof RegExp` is `true` for any regular expression, whether created as a literal (`/…/`) or with `new RegExp(…)`. In the SFMC Jint engine `instanceof RegExp` is **always `false`** — even for `new RegExp("\\d+")` (runtime-verified). This is the mirror image of the `Function` quirk above: for `RegExp`, `re.constructor === RegExp` correctly returns **`true`**, so use the constructor comparison (not `instanceof`) to detect a RegExp.
- name: "RegExp.exec"
  url: "/ecmascript-builtins/regular-expressions/#exec"
  officialUrl: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/RegExp/exec"
  tagline: "capture groups undefined, result.length always 3, index/input work"
  part: "ecmascript"
  category: "ECMAScript Builtins"
  object: "RegExp"
  severity: "high"
  discrepancy: "B3"
  anchor: "regexp-exec-capture-groups"
  body: |
    MDN specifies that `exec()` returns an array whose element `[0]` is the full match and `[1]…[n]` are the captured groups, with `length` reflecting the group count and `index`/`input` properties set. In the SFMC Jint engine `result[0]`, `result.index`, and `result.input` are correct, but **capture groups `result[1]+` are all `undefined`** and **`result.length` is always `3`** regardless of how many groups the pattern has (runtime-verified). Read capture groups by matching a non-global pattern with `String.match` instead.
- name: "RegExp lastIndex"
  url: "/ecmascript-builtins/regular-expressions/#lastindex"
  officialUrl: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/RegExp/lastIndex"
  tagline: "never advances and manual assignment is ignored"
  part: "ecmascript"
  category: "ECMAScript Builtins"
  object: "RegExp"
  severity: "high"
  discrepancy: "B3"
  anchor: "regexp-lastindex-inert"
  body: |
    MDN specifies that with the `g` (or `y`) flag, `exec()` and `test()` update `lastIndex` so successive calls advance through the string, and that assigning `lastIndex` repositions the next search. In the SFMC Jint engine `lastIndex` **stays `0`** after `exec()`/`test()` with the `g` flag, and **manually setting `lastIndex` is ignored** — the next `exec()` still matches from the start (runtime-verified). The classic `while ((m = re.exec(str)) !== null)` loop never terminates. Use `String.match(/…/g)` to collect all matches in one call.
- name: "RegExp.ignoreCase / multiline"
  url: "/ecmascript-builtins/regular-expressions/#ignorecase"
  officialUrl: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/RegExp/ignoreCase"
  tagline: "undefined"
  part: "ecmascript"
  category: "ECMAScript Builtins"
  object: "RegExp"
  severity: "medium"
  discrepancy: "B2"
  anchor: "regexp-ignorecase-multiline-undefined"
  body: |
    MDN specifies `RegExp.prototype.ignoreCase` and `RegExp.prototype.multiline` as boolean accessors reflecting the `i` and `m` flags. In the SFMC Jint engine both are **`undefined`** on every RegExp (runtime-verified), even when the corresponding flag is set — the flags themselves still work at match time (`/x/i` is case-insensitive, `/^…/m` matches line starts), you just cannot read them back. `source`, `global`, and `lastIndex` are the only readable accessors. Track the `i`/`m` flags yourself if you need them.
- name: "String.search"
  url: "/ecmascript-builtins/string-methods/#search"
  officialUrl: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String/search"
  tagline: "unreliable index, no-match returns 0 not -1"
  part: "ecmascript"
  category: "ECMAScript Builtins"
  object: "String"
  severity: "high"
  discrepancy: "B3"
  anchor: "string-search-unreliable"
  body: |
    MDN specifies `String.prototype.search(regexp)` returns the **index of the first match, or `-1`** when there is no match. In the SFMC Jint engine it is unreliable: a **no-match returns `0`** instead of `-1`, and some real matches return the **wrong index** (a match at position 9 was observed returning `10`; a no-match returns `0` which is indistinguishable from a match at the start) — runtime-verified. Do not use `search` to detect or locate a match. Use `RegExp.test` to detect a match, or `String.match` (whose `[0]` is correct) to read it, or apply the search polyfill.
- name: "String.charAt"
  url: "/ecmascript-builtins/string-methods/#charat"
  officialUrl: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String/charAt"
  tagline: "out-of-range index returns the last char, not \"\""
  part: "ecmascript"
  category: "ECMAScript Builtins"
  object: "String"
  severity: "high"
  discrepancy: "B3"
  anchor: "string-charat-out-of-range"
  body: |
    MDN specifies `String.prototype.charAt(index)` returns the **empty string `""`** when `index` is negative or `>= str.length`. In the SFMC Jint engine an out-of-range index instead returns the **last character** of the string — `"Hello".charAt(99)` and `"Hello".charAt(5)` both return `"o"` (runtime-verified). Bracket access for an out-of-range index behaves differently again: `"Hello"[99]` **throws** `"Index was outside the bounds of the array"` rather than returning `undefined`. Guard the index against `.length` before reading a character.
