# Getting-started narrative test scripts.

the-two-layers: |
  <script runat="server">
  /*
   * Chapter: The Two Layers
   * Proves:
   *   1. Platform available; bare DataExtension undefined before Load.
   * EXPECTED OUTPUT: every line starts with PASS.
   */
  function assert(id, actual, expected) {
      Platform.Response.Write((actual === expected ? "PASS " : "FAIL ") + id + " -> [" + actual + "]\n");
  }
  function typeOfThunk(fn) {
      try { return "" + fn(); } catch (ex) { return "THREW:" + ("" + ex.message); }
  }
  assert("Platform typeof", typeof Platform, "clr");
  assert("DataExtension before Load", typeOfThunk(function () { return typeof DataExtension; }), "undefined");
  </script>

platform-functions: |
  <script runat="server">
  /*
   * Chapter: Platform Functions
   * Proves:
   *   1. Platform.Function.Now without Core load.
   * EXPECTED OUTPUT: every line starts with PASS.
   */
  function assert(id, actual, expected) {
      Platform.Response.Write((actual === expected ? "PASS " : "FAIL ") + id + " -> [" + actual + "]\n");
  }
  function typeOfThunk(fn) {
      try { return "" + fn(); } catch (ex) { return "THREW:" + ("" + ex.message); }
  }
  var now = Platform.Function.Now();
  assert("Now typeof", typeof now === "string" || typeof now === "object" ? "ok" : typeof now, "ok");
  </script>

