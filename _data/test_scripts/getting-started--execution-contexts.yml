# Getting-started narrative test scripts.

executioncontexttype: |
  <script runat="server">
  /*
   * Chapter: ExecutionContextType (page documents Method here)
   * Proves:
   *   1. Method is a CLR value; String()/""+ coerce to "GET" on this CloudPage GET.
   *   2. Raw === "GET" is false without coercion.
   * EXPECTED OUTPUT: every line starts with PASS.
   */
  function assert(id, actual, expected) {
      Platform.Response.Write((actual === expected ? "PASS " : "FAIL ") + id + " -> [" + actual + "]\n");
  }
  assert("Method typeof not string", typeof Platform.Request.Method === "string" ? "string" : "clrish", "clrish");
  assert("raw === GET is false", Platform.Request.Method === "GET" ? "true" : "false", "false");
  assert("String(Method) is GET", String(Platform.Request.Method), "GET");
  assert("''+ Method is GET", "" + Platform.Request.Method, "GET");
  </script>

executioncontextname: |
  <script runat="server">
  /*
   * Chapter: ExecutionContextName
   * Proves:
   *   1. GetQueryStringParameter("_pageId") is callable (CloudPage id when present).
   *   2. Method coerce pattern from the names table.
   * NON-ASSERTABLE: Automation ExecutionContextName string (not on CloudPage GET).
   * EXPECTED OUTPUT: every line starts with PASS.
   */
  function assert(id, actual, expected) {
      Platform.Response.Write((actual === expected ? "PASS " : "FAIL ") + id + " -> [" + actual + "]\n");
  }
  var pageId = Platform.Request.GetQueryStringParameter("_pageId");
  assert("_pageId typeof string-or-empty", typeof pageId === "string" || pageId === null ? "ok" : typeof pageId, "ok");
  assert("Method coerce GET", "" + Platform.Request.Method, "GET");
  </script>

