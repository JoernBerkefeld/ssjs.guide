cookies: |
  <script runat="server">
  /*
   * Chapter: Cookies
   * Proves:
   *   1. GetCookieValue for missing cookie; SetCookie returns null.
   * EXPECTED OUTPUT: every line starts with PASS.
   */
  function assert(id, actual, expected) {
      Platform.Response.Write((actual === expected ? "PASS " : "FAIL ") + id + " -> [" + actual + "]\n");
  }
  function typeOfThunk(fn) {
      try { return "" + fn(); } catch (ex) { return "THREW:" + ("" + ex.message); }
  }
  var v = Platform.Request.GetCookieValue("gsNoCookie20260815");
  assert("missing cookie", v === null || ("" + v) === "null" || v === "" ? "absent" : "present", "absent");
  var ret = Platform.Response.SetCookie("gsProbeCookie", "1");
  assert("SetCookie returns null", ret === null ? "null" : "other", "null");
  </script>

