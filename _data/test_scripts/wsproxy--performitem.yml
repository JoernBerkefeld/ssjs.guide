  assert("cleanup: target data extension deleted", "" + proxy.deleteItem("DataExtension", { CustomerKey: deKey }).Status, "OK");
  </script>

examples: |
  <script runat="server">
  /*
   * Chapter: Examples
   *
   * Runs the "Start a Query Definition" example verbatim in structure and
   * proves every claim it makes:
   *   1. `new Script.Util.WSProxy()` yields a WSProxy CLR instance.
   *   2. `proxy.performItem("QueryDefinition", { ObjectID: queryObjectId },
   *      "Start")` returns an object whose `Status` is the string "OK" — the
   *      value the example writes out.
   *   3. The single properties object produces a single Results entry that
   *      reports the perform was called.
   *   4. The perform really reached the API — the entry carries a Task
   *      sub-object with an InteractionObjectID identifying the queued task.
   *
   * NOT ASSERTED: the second example ("Start an Automation") is labelled by
   * the page itself as an "example shape" and is not runnable here — it would
   * require an existing Automation fixture and starting a real automation on
   * the business unit, which is destructive and outside this page's scope.
   * The page states that the SOAP object type and property shape must match
   * the target object; that requirement is object-specific, not a claim about
   * performItem itself.
   *
   * EXPECTED OUTPUT: every line starts with PASS.
   */

  function assert(id, actual, expected) {
      Platform.Response.Write((actual === expected ? "PASS " : "FAIL ") + id + " -> [" + actual + "]\n");
  }

  var runId = "" + (new Date()).getTime();
  var deKey = "ssjsg_piX_de_" + runId;
  var qdKey = "ssjsg_piX_qd_" + runId;

  var setup = new Script.Util.WSProxy();
  assert("fixture target data extension created", "" + setup.createItem("DataExtension", {
      CustomerKey: deKey, Name: deKey,
      Fields: [{ Name: "SubscriberKey", FieldType: "Text", MaxLength: 50, IsPrimaryKey: true, IsRequired: true }]
  }).Status, "OK");
  assert("fixture query definition created", "" + setup.createItem("QueryDefinition", {
      CustomerKey: qdKey, Name: qdKey,
      QueryText: "SELECT SubscriberKey FROM _Subscribers",
      TargetType: "DE",
      DataExtensionTarget: { CustomerKey: deKey, Name: deKey },
      TargetUpdateType: "Overwrite"
  }).Status, "OK");
  var queryObjectId = setup.retrieve("QueryDefinition", ["ObjectID"], { Property: "CustomerKey", SimpleOperator: "equals", Value: qdKey }).Results[0].ObjectID;

  /* --- the page example, verbatim in structure --- */
  var proxy = new Script.Util.WSProxy();
  var result = proxy.performItem(
      "QueryDefinition",
      { ObjectID: queryObjectId },
      "Start"
  );
  /* Write(result.Status); */

  /* 1. + 2. */
  assert("example line 1: the constructor yields a WSProxy CLR instance", typeof proxy, "clr");
  assert("example line 2: performItem returns an object", typeof result, "object");
  assert("example line 7: result.Status is a string", typeof result.Status, "string");
  assert("example line 7: result.Status is OK", "" + result.Status, "OK");

  /* 3. */
  assert("the single properties object produces one Results entry", "" + result.Results.length, "1");
  assert("Results[0] is the acted-on item", "" + result.Results[0].OrdinalID, "0");
  assert("Results[0] reports the perform was called", "" + result.Results[0].StatusMessage, "QueryDefinition perform called successfully");

  /* 4. */
  assert("Results[0] carries a queued Task", typeof result.Results[0].Task, "object");
  assert("Results[0].Task.InteractionObjectID is a GUID of canonical length", "" + ("" + result.Results[0].Task.InteractionObjectID).length, "36");

  /* Cleanup — the business unit is left clean. */
  assert("cleanup: query definition deleted", "" + proxy.deleteItem("QueryDefinition", { ObjectID: queryObjectId }).Status, "OK");
  assert("cleanup: target data extension deleted", "" + proxy.deleteItem("DataExtension", { CustomerKey: deKey }).Status, "OK");
  </script>
