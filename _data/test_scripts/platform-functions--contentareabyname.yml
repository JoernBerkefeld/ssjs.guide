# Test scripts for /platform-functions/contentareabyname/
#
# One key per chapter on the page. Each script is a self-contained SSJS
# CloudPage snippet that asserts every claim the chapter makes — positive,
# negative, and the documented deviation from the official Salesforce docs.
#
# All scripts were last run green (every line PASS) against a live SFMC
# CloudPage. Re-run them before changing any claim on the page.
#
# AUTHORING RULE: report each assertion on its own Platform.Response.Write
# call. Concatenating several independent expressions into one Write can
# interleave their evaluation in the Jint engine and pair labels with the
# wrong values.
#
# ENGINE NOTE: the CLR exception messages thrown by ContentAreaByName cannot
# be inspected with .length / .indexOf / .substring — those operations abort
# the whole CloudPage with HTTP 422. The messages may only be concatenated
# into output verbatim, so these scripts assert "it throws" and PRINT the
# message rather than matching it programmatically.

parameters: |
  <script runat="server">
  Platform.Load("core", "1.1.5");

  /*
   * Chapter: Parameters —
   *   Platform.Function.ContentAreaByName(name[, regionName, stopOnError, fallbackContent])
   *
   * Proves:
   *   1. The member resolves on Platform.Function (typeof "clrmethodinfo",
   *      the engine's uniform marker for a host CLR method — it proves
   *      nothing about existence, only invocation does).
   *   2. DEV the required `name` parameter alone — the minimal documented
   *      call — does NOT return content: it throws. The official docs
   *      describe a 1-argument call as valid and returning the content
   *      area's markup.
   *   3. DEV the documented optional `regionName` (parameter 2) does not work
   *      either, and fails DIFFERENTLY: it is rejected as a resolved-value
   *      parameter. A string literal, the empty string and null all throw.
   *   4. Because parameter 2 is rejected, the documented `stopOnError`
   *      (parameter 3) and `fallbackContent` (parameter 4) are UNREACHABLE:
   *      arity 3 and arity 4 throw the same ImpressionRegionName error, so
   *      neither stopOnError:false nor the fallback string ever takes effect.
   *   5. Arities outside the documented 1..4 range (0 and 5) throw the
   *      overloaded "security descriptor" error.
   *
   * NOT ASSERTED: the exact text of the thrown messages. Any string operation
   * on these CLR exception messages (.length / .indexOf / .substring) aborts
   * the CloudPage with HTTP 422, so each message is printed verbatim next to
   * its assertion for the reader instead of being matched programmatically.
   *
   * EXPECTED OUTPUT: every line starts with PASS. A FAIL means the runtime no
   * longer matches the documented claim and the page must be revised.
   */

  function assert(id, actual, expected) {
      Platform.Response.Write((actual === expected ? "PASS " : "FAIL ") + id + " -> [" + actual + "]\n");
  }
  function assertThrows(id, fn) {
      var threw = false, msg = "";
      try { fn(); } catch (ex) { threw = true; msg = ex.message; }
      Platform.Response.Write((threw ? "PASS " : "FAIL ") + id + " -> " + (threw ? "threw: " + msg : "did NOT throw") + "\n");
  }

  /* 1. The member resolves as a host CLR method. */
  assert("typeof Platform.Function.ContentAreaByName is clrmethodinfo", String(typeof Platform.Function.ContentAreaByName), "clrmethodinfo");

  /* 2. DEV the minimal documented call (name only) throws. */
  assertThrows("DEV arity 1 with a folder-path name throws (docs: returns the content)", function () {
      return Platform.Function.ContentAreaByName("My Content\\myContentArea");
  });
  assertThrows("DEV arity 1 with a bare name throws too", function () {
      return Platform.Function.ContentAreaByName("myContentArea");
  });

  /* 3. DEV the documented optional regionName is rejected as a resolved value. */
  assertThrows("DEV arity 2 regionName string literal throws (docs: optional impression region)", function () {
      return Platform.Function.ContentAreaByName("My Content\\myContentArea", "impressionRegion");
  });
  assertThrows("DEV arity 2 empty-string regionName throws as well", function () {
      return Platform.Function.ContentAreaByName("My Content\\myContentArea", "");
  });
  assertThrows("DEV arity 2 null regionName throws as well", function () {
      return Platform.Function.ContentAreaByName("My Content\\myContentArea", null);
  });

  /* 4. stopOnError and fallbackContent are unreachable behind that rejection. */
  assertThrows("DEV arity 3 stopOnError=false still throws (docs: false lets the call proceed)", function () {
      return Platform.Function.ContentAreaByName("My Content\\myContentArea", "impressionRegion", false);
  });
  assertThrows("DEV arity 3 stopOnError=true throws", function () {
      return Platform.Function.ContentAreaByName("My Content\\myContentArea", "impressionRegion", true);
  });
  assertThrows("DEV arity 4 fallbackContent never emitted, call throws (docs: fallback is displayed)", function () {
      return Platform.Function.ContentAreaByName("My Content\\myContentArea", "impressionRegion", false, "Fallback text here");
  });

  /* 5. Off-signature arities throw the overloaded security-descriptor error. */
  assertThrows("arity 0 throws", function () {
      return Platform.Function.ContentAreaByName();
  });
  assertThrows("arity 5 throws", function () {
      return Platform.Function.ContentAreaByName("a", "reg", false, "fb", "extra");
  });
  </script>

description: |
  <script runat="server">
  Platform.Load("core", "1.1.5");

  /*
   * Chapter: Description — deprecated, unusable from SSJS, and how the
   * bare-name Core form compares.
   *
   * Proves:
   *   1. DEV the failure is NOT "this business unit has no Content Areas".
   *      A WSProxy retrieve of the ContentArea SOAP object returns Status OK
   *      with at least one real area present, yet the by-name lookup still
   *      throws — so the deprecation, not an empty account, is what fails.
   *   2. Every name shape fails the same way: a folder-path name, a bare
   *      name and the empty string all throw.
   *   3. The bare-name Core form IS defined as a real function after
   *      Platform.Load("core", "1.1.5") — typeof is "function", not the
   *      "clrmethodinfo" marker the Platform.Function form reports — so the
   *      global is genuinely present, and it is no escape hatch: it throws
   *      for arity 1 and arity 2 exactly like the qualified form.
   *   4. DEV the bare-name form's documented 3rd parameter (the string
   *      errorMsg, where the Platform.Function form takes a boolean
   *      stopOnError) is unreachable: arity 3 throws the security-descriptor
   *      error rather than returning the error message.
   *   5. The recommended replacement path is real: Platform.Function
   *      resolves ContentBlockByName as a host method (the documented modern
   *      substitute for classic Content Areas).
   *
   * NOT ASSERTED: that a Content Area ever renders. No arity of either form
   * returns a value, so there is no positive result to assert. Also not
   * assertable: a by-name call against a *known-good* area name. The SOAP
   * ContentArea object in this business unit returns an empty Name for the
   * area it exposes (only ID and CustomerKey carry values), so no verifiable
   * name string can be fed to the function — the existence check below is
   * therefore made on the retrieve result, not on a successful lookup.
   *
   * EXPECTED OUTPUT: every line starts with PASS.
   */

  function assert(id, actual, expected) {
      Platform.Response.Write((actual === expected ? "PASS " : "FAIL ") + id + " -> [" + actual + "]\n");
  }
  function assertThrows(id, fn) {
      var threw = false, msg = "";
      try { fn(); } catch (ex) { threw = true; msg = ex.message; }
      Platform.Response.Write((threw ? "PASS " : "FAIL ") + id + " -> " + (threw ? "threw: " + msg : "did NOT throw") + "\n");
  }

  /* 1. A real Content Area exists in this business unit. */
  var realCount = 0;
  var proxyStatus = "";
  try {
      var prox = new Script.Util.WSProxy();
      var res = prox.retrieve("ContentArea", ["ID", "Name"], null);
      proxyStatus = res.Status;
      if (res.Results && res.Results.length > 0) {
          realCount = res.Results.length;
      }
  } catch (ex) {
      proxyStatus = "threw: " + ex.message;
  }
  assert("WSProxy retrieve of the ContentArea object succeeds", String(proxyStatus), "OK");
  assert("DEV at least one real Content Area exists in this BU, yet no by-name call works", realCount > 0 ? "true" : "false", "true");

  /* 2. Every name shape fails identically. */
  assertThrows("a folder-path name throws", function () {
      return Platform.Function.ContentAreaByName("My Content\\myContentArea");
  });
  assertThrows("a bare name throws", function () {
      return Platform.Function.ContentAreaByName("myContentArea");
  });
  assertThrows("the empty string throws", function () {
      return Platform.Function.ContentAreaByName("");
  });

  /* 3. The bare-name Core form is a real function but is no escape hatch. */
  assert("typeof the bare-name ContentAreaByName is function after Platform.Load", String(typeof ContentAreaByName), "function");
  assertThrows("bare-name arity 1 throws too", function () {
      return ContentAreaByName("My Content\\myContentArea");
  });
  assertThrows("bare-name arity 2 with a regionName throws too", function () {
      return ContentAreaByName("My Content\\myContentArea", "impressionRegion");
  });

  /* 4. DEV the bare-name form's string errorMsg (3rd parameter) is unreachable. */
  assertThrows("DEV bare-name arity 3 with the string errorMsg throws (docs: returns that message)", function () {
      return ContentAreaByName("My Content\\myContentArea", "impressionRegion", "Could not load content area");
  });
  assertThrows("DEV bare-name arity 4 with a fallback throws (docs: shows the fallback)", function () {
      return ContentAreaByName("My Content\\myContentArea", "impressionRegion", "Could not load content area", "Fallback text here");
  });

  /* 5. The documented modern replacement resolves as a host method. */
  assert("typeof Platform.Function.ContentBlockByName is clrmethodinfo", String(typeof Platform.Function.ContentBlockByName), "clrmethodinfo");
  </script>

no-working-call-shape: |
  <script runat="server">
  Platform.Load("core", "1.1.5");

  /*
   * Differs-from-docs claim: the official Salesforce documentation presents
   * Platform.Function.ContentAreaByName(name, regionName, stopOnError,
   * fallbackContent) as an ordinary callable returning the content area's
   * rendered markup, with stopOnError:false letting a failed call proceed and
   * fallbackContent shown when nothing is returned. At runtime NO arity
   * returns a value.
   *
   * Official docs: ContentAreaByName("My Content\\myContentArea",
   *                "impressionRegion", false, "defaultContentHere")
   *                returns the content the area produced.
   * SFMC runtime:  arity 1     -> "An error occurred when attempting to
   *                                evaluate a ContentAreaByName function
   *                                call."
   *                arity 2/3/4 -> "A ContentAreaByName function call includes
   *                                an invalid parameter value. … must be a
   *                                literal (constant) values."
   *                                Parameter Name: ImpressionRegionName
   *                                Parameter Ordinal: 2
   *                                Parameter Type: ResolvedValueParameter
   *                arity 0/5+  -> "Unable to retrieve security descriptor for
   *                                this frame."
   *                (each message is printed verbatim by its assertion below)
   *
   * Proves every part of the claim:
   *   1. DEV arity 1 throws for a folder-path name, a bare name and the
   *      empty string — even though a WSProxy retrieve proves a Content Area
   *      exists in this business unit.
   *   2. DEV arity 2 throws a DIFFERENT, resolved-value error for every
   *      regionName shape: string literal, concatenation, variable, empty
   *      string and null. So the failure is not "literal vs variable" — the
   *      parameter cannot be supplied at all.
   *   3. DEV arity 3 and arity 4 throw the same parameter-2 error, which is
   *      what makes stopOnError and fallbackContent unreachable: the fallback
   *      string is never emitted.
   *   4. Arity 0 and arity 5 throw the overloaded security-descriptor error.
   *   5. DEV the bare-name Core alias throws too, so the deviation is not
   *      specific to the Platform.Function namespace — and its arity 3/4
   *      forms throw the security-descriptor error, making its documented
   *      errorMsg parameter unreachable as well.
   *
   * NOT ASSERTED: a by-name call against a known-good area name. The SOAP
   * ContentArea object in this business unit reports an empty Name for the
   * area it exposes, so no verifiable name string can be supplied.
   *
   * EXPECTED OUTPUT: every line starts with PASS.
   */

  function assert(id, actual, expected) {
      Platform.Response.Write((actual === expected ? "PASS " : "FAIL ") + id + " -> [" + actual + "]\n");
  }
  function assertThrows(id, fn) {
      var threw = false, msg = "";
      try { fn(); } catch (ex) { threw = true; msg = ex.message; }
      Platform.Response.Write((threw ? "PASS " : "FAIL ") + id + " -> " + (threw ? "threw: " + msg : "did NOT throw") + "\n");
  }

  /* 1. DEV arity 1 throws for every name shape. */
  var realCount = 0;
  try {
      var prox = new Script.Util.WSProxy();
      var res = prox.retrieve("ContentArea", ["ID", "Name"], null);
      if (res.Results && res.Results.length > 0) { realCount = res.Results.length; }
  } catch (ex) { realCount = 0; }
  assert("a real Content Area exists in this BU for this run", realCount > 0 ? "true" : "false", "true");

  assertThrows("DEV arity 1 folder-path name throws (docs: returns content)", function () {
      return Platform.Function.ContentAreaByName("My Content\\myContentArea");
  });
  assertThrows("DEV arity 1 bare name throws (docs: returns content)", function () {
      return Platform.Function.ContentAreaByName("myContentArea");
  });
  assertThrows("DEV arity 1 empty-string name throws (docs: returns content)", function () {
      return Platform.Function.ContentAreaByName("");
  });

  /* 2. DEV every regionName shape is rejected as a resolved value. */
  assertThrows("DEV arity 2 string literal regionName throws", function () {
      return Platform.Function.ContentAreaByName("My Content\\myContentArea", "impressionRegion");
  });
  assertThrows("DEV arity 2 concatenated regionName throws", function () {
      return Platform.Function.ContentAreaByName("My Content\\myContentArea", "impression" + "Region");
  });
  var dynRegion = "impressionRegion";
  assertThrows("DEV arity 2 variable regionName throws", function () {
      return Platform.Function.ContentAreaByName("My Content\\myContentArea", dynRegion);
  });
  assertThrows("DEV arity 2 empty-string regionName throws", function () {
      return Platform.Function.ContentAreaByName("My Content\\myContentArea", "");
  });
  assertThrows("DEV arity 2 null regionName throws", function () {
      return Platform.Function.ContentAreaByName("My Content\\myContentArea", null);
  });

  /* 3. DEV stopOnError and fallbackContent never take effect. */
  assertThrows("DEV arity 3 stopOnError=false throws (docs: the call proceeds)", function () {
      return Platform.Function.ContentAreaByName("My Content\\myContentArea", "impressionRegion", false);
  });
  assertThrows("DEV arity 3 stopOnError=true throws", function () {
      return Platform.Function.ContentAreaByName("My Content\\myContentArea", "impressionRegion", true);
  });
  assertThrows("DEV arity 4 throws so fallbackContent is never emitted (docs: fallback shown)", function () {
      return Platform.Function.ContentAreaByName("My Content\\myContentArea", "impressionRegion", false, "FALLBACK");
  });
  assertThrows("DEV arity 4 with a null regionName throws as well", function () {
      return Platform.Function.ContentAreaByName("My Content\\myContentArea", null, false, "FALLBACK");
  });

  /* 4. Off-signature arities throw the overloaded security-descriptor error. */
  assertThrows("arity 0 throws", function () {
      return Platform.Function.ContentAreaByName();
  });
  assertThrows("arity 5 throws", function () {
      return Platform.Function.ContentAreaByName("a", "reg", false, "fb", "extra");
  });

  /* 5. DEV the bare-name Core alias throws at every arity too. */
  assertThrows("DEV bare-name arity 1 throws as well", function () {
      return ContentAreaByName("My Content\\myContentArea");
  });
  assertThrows("DEV bare-name arity 2 throws as well", function () {
      return ContentAreaByName("My Content\\myContentArea", "impressionRegion");
  });
  assertThrows("DEV bare-name arity 3 errorMsg throws, so errorMsg is unreachable", function () {
      return ContentAreaByName("My Content\\myContentArea", "impressionRegion", "err");
  });
  assertThrows("DEV bare-name arity 4 throws, so its fallbackContent is unreachable", function () {
      return ContentAreaByName("My Content\\myContentArea", "impressionRegion", "err", "FALLBACK");
  });
  assertThrows("bare-name arity 0 throws", function () {
      return ContentAreaByName();
  });
  assertThrows("bare-name arity 5 throws", function () {
      return ContentAreaByName("a", "reg", "err", "fb", "extra");
  });
  </script>

examples: |
  <script runat="server">
  Platform.Load("core", "1.1.5");

  /*
   * Chapter: Examples — both documented examples, and the replacement.
   *
   * Proves:
   *   1. DEV example 1, the plain 1-argument call
   *      Platform.Function.ContentAreaByName("My Content\\myContentArea"),
   *      throws instead of returning the content area's markup as the docs
   *      show.
   *   2. DEV example 2, the full 4-argument call
   *      Platform.Function.ContentAreaByName("My Content\\myContentArea",
   *      "impressionRegion", false, "Fallback text here"), throws too — the
   *      documented fallbackContent is never written to the response.
   *   3. Because the call throws, Platform.Response.Write() never receives a
   *      value: the variable both examples assign to stays undefined, and the
   *      fallback string is not the result.
   *   4. The page's recommended replacement,
   *      Platform.Function.ContentBlockByName, resolves as a host CLR method.
   *
   * NOT ASSERTED: the rendered output of a working Content Area, and whether
   * an impression is recorded for the region. No call shape succeeds, and
   * impression counts only surface in Marketing Cloud tracking reports after
   * a send is processed, which is not observable from within this request.
   *
   * EXPECTED OUTPUT: every line starts with PASS.
   */

  function assert(id, actual, expected) {
      Platform.Response.Write((actual === expected ? "PASS " : "FAIL ") + id + " -> [" + actual + "]\n");
  }
  function assertThrows(id, fn) {
      var threw = false, msg = "";
      try { fn(); } catch (ex) { threw = true; msg = ex.message; }
      Platform.Response.Write((threw ? "PASS " : "FAIL ") + id + " -> " + (threw ? "threw: " + msg : "did NOT throw") + "\n");
  }

  /* 1. DEV example 1 — the plain 1-argument call. */
  assertThrows("DEV example 1: ContentAreaByName(name) throws (docs: returns the content)", function () {
      return Platform.Function.ContentAreaByName("My Content\\myContentArea");
  });

  /* 3. The assigned variable therefore never receives a value. */
  var content1;
  try { content1 = Platform.Function.ContentAreaByName("My Content\\myContentArea"); } catch (ex1) { /* documented throw */ }
  assert("example 1: the assigned variable stays undefined", String(typeof content1), "undefined");

  /* 2. DEV example 2 — the full 4-argument call with a fallback. */
  assertThrows("DEV example 2: the 4-argument call throws (docs: shows the fallback)", function () {
      return Platform.Function.ContentAreaByName("My Content\\myContentArea", "impressionRegion", false, "Fallback text here");
  });

  var content2;
  try { content2 = Platform.Function.ContentAreaByName("My Content\\myContentArea", "impressionRegion", false, "Fallback text here"); } catch (ex2) { /* documented throw */ }
  assert("example 2: the fallback is never assigned", String(typeof content2), "undefined");
  assert("example 2: the fallback string is NOT the result", content2 === "Fallback text here" ? "true" : "false", "false");

  /* 4. The recommended replacement resolves as a host method. */
  assert("typeof Platform.Function.ContentBlockByName is clrmethodinfo", String(typeof Platform.Function.ContentBlockByName), "clrmethodinfo");
  </script>
