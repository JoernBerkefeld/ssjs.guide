for-in-loop: |
  <script runat="server">
  /*
   * Chapter: for...in
   * Proves:
   *   1. enumerates keys; array for-in is fragile vs indexed for.
   * EXPECTED OUTPUT: every line starts with PASS.
   */
  function assert(id, actual, expected) {
      Platform.Response.Write((actual === expected ? "PASS " : "FAIL ") + id + " -> [" + actual + "]\n");
  }
  function assertThrows(id, fn) {
      var threw = false, msg = "";
      try { fn(); } catch (ex) { threw = true; msg = "" + ex.message; }
      Platform.Response.Write((threw ? "PASS " : "FAIL ") + id + " -> " + (threw ? "threw: " + msg : "did NOT throw") + "\n");
  }
  var config = { a: 1, b: 2 }, keys = "";
  for (var key in config) keys += key;
  assert("has a", keys.indexOf("a") >= 0 ? "true" : "false", "true");
  var arr = ["x", "y"], indexed = "";
  for (var i = 0; i < arr.length; i++) indexed += arr[i];
  assert("indexed for", indexed, "xy");
  </script>

