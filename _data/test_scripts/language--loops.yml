# Narrative language page test scripts. Re-probe before claim edits.

for-loop: |
  <script runat="server">
  /*
   * Chapter: for Loop
   * Proves:
   *   1. for + cached length.
   * EXPECTED OUTPUT: every line starts with PASS.
   */
  function assert(id, actual, expected) {
      Platform.Response.Write((actual === expected ? "PASS " : "FAIL ") + id + " -> [" + actual + "]\n");
  }
  function assertThrows(id, fn) {
      var threw = false, msg = "";
      try { fn(); } catch (ex) { threw = true; msg = "" + ex.message; }
      Platform.Response.Write((threw ? "PASS " : "FAIL ") + id + " -> " + (threw ? "threw: " + msg : "did NOT throw") + "\n");
  }
  var rows = [{ Email: "a@x.com" }, { Email: "b@x.com" }], out = "", len = rows.length;
  for (var i = 0; i < len; i++) out += rows[i].Email + ",";
  assert("for", out, "a@x.com,b@x.com,");
  var items = [1, 2, 3], rev = "";
  for (var j = items.length - 1; j >= 0; j--) rev += items[j];
  assert("reverse", rev, "321");
  </script>

