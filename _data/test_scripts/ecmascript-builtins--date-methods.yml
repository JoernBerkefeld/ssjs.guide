# Test scripts for /ecmascript-builtins/date-methods/
#
# One key per chapter on the page. Each script is a self-contained SSJS
# CloudPage snippet that asserts every claim the chapter makes — positive,
# negative, and every documented deviation from the ECMAScript spec / MDN.
#
# All scripts were last run green (every line PASS) against a live SFMC
# CloudPage. Re-run them before changing any claim on the page.
#
# DETERMINISM RULE: never assert anything that depends on the current clock,
# the account time zone, or locale-formatted output. Every assertion is built
# on FIXED inputs — new Date(2020, 0, 15, 10, 30, 45), new Date(0) or an
# explicit epoch millisecond value — and asserts stable derived values.
#
# AUTHORING RULE: report each assertion on its own Platform.Response.Write
# call. Concatenating several independent expressions into one Write can
# interleave their evaluation in the Jint engine and pair labels with the
# wrong values.

getfullyear: |
  <script runat="server">
  Platform.Load("core", "1.1.5");

  /*
   * Chapter: getFullYear() — ES3, works
   *
   * Proves:
   *   1. getFullYear() returns the four-digit LOCAL year of a date built from
   *      local components, so the result is time-zone independent.
   *   2. typeof the result is "number".
   *   3. It round-trips for a second, unrelated year.
   *
   * EXPECTED OUTPUT: every line starts with PASS.
   */

  function assert(id, actual, expected) {
      var got;
      try { got = String(actual); } catch (ex) { got = "THREW: " + ex.message; }
      Platform.Response.Write((got === String(expected) ? "PASS " : "FAIL ") + id + " -> [" + got + "]\n");
  }

  var d = new Date(2020, 0, 15, 10, 30, 45);
  assert("new Date(2020,0,15).getFullYear() is 2020", d.getFullYear(), "2020");
  assert("typeof getFullYear() is number", typeof d.getFullYear(), "number");
  var d2 = new Date(1999, 11, 31);
  assert("new Date(1999,11,31).getFullYear() is 1999", d2.getFullYear(), "1999");
  assert("typeof Date.prototype.getFullYear is function", typeof Date.prototype.getFullYear, "function");
  </script>

