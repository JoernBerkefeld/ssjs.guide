      var api = new Script.Util.WSProxy();
      var fr = api.retrieve("DataFolder", ["ID", "Name"], { Property: "ContentType", SimpleOperator: "equals", Value: "media" });
      return fr.Results && fr.Results.length ? fr.Results[0].ID : null;
