  /* Genuinely null -> the explicit check returns the fallback. */
  var chkNull = "unset";
  try { eval("chkNull = (function(){ var name = null; return (name !== null && name !== undefined) ? name : 'Subscriber'; })();"); } catch (exc2) { chkNull = "THREW"; }
