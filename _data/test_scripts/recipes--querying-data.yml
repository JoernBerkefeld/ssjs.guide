lookuporderedrows: |
  <script runat="server">
  /*
   * Chapter: Sorted and limited: LookupOrderedRows
   *
   * Creates the "Customers" fixture Data Extension (Name = external key),
   * runs the page example VERBATIM, asserts its results, then deletes the
   * fixture again.
   *
   * EXPECTED OUTPUT: every line starts with PASS.
