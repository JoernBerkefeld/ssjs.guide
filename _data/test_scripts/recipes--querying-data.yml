# Test scripts for /recipes/querying-data/
#
# One key per chapter. Every script creates the "Customers" fixture Data
# Extension (Name = external key), runs the page example VERBATIM, asserts
# its result and deletes the fixture again.
#
# All scripts were last run green (every line PASS) on a live SFMC CloudPage
# on 2026-11-25. Re-run them before changing any claim on the page.
#
# Array sort() needs an explicit compare function in this engine (byText).

which-method: |
  <script runat="server">
  /*
   * Chapter: Which method should I use?
   *
   * Creates the "Customers" fixture Data Extension (Name = external key),
   * runs the page example VERBATIM, asserts its results, then deletes the
   * fixture again.
   *
   * EXPECTED OUTPUT: every line starts with PASS.
   */
  function assert(id, actual, expected) {
      Platform.Response.Write((actual === expected ? "PASS " : "FAIL ") + id + " -> [" + actual + "]\n");
  }
  function byText(a, b) { return a < b ? -1 : (a > b ? 1 : 0); }
  function sortedKeys(r) {
      var k = [];
      for (var x = 0; x < r.Results.length; x++) {
          var p = r.Results[x].Properties;
          for (var y = 0; y < p.length; y++) { if (("" + p[y].Name) === "SubscriberKey") { k.push("" + p[y].Value); } }
      }
      k.sort(byText);
      return k.join(",");
  }
  Platform.Load("core", "1.1.5");

  /* --- fixture --- */
  var fxProxy = new Script.Util.WSProxy();
  try { fxProxy.deleteBatch("DataExtension", [{ CustomerKey: "Customers" }]); } catch (fxE) {}
  var fxCreate = fxProxy.createItem("DataExtension", {
      Name: "Customers", CustomerKey: "Customers",
      Fields: [
          { Name: "SubscriberKey", FieldType: "Text", MaxLength: 50, IsPrimaryKey: true, IsRequired: true },
          { Name: "Email", FieldType: "EmailAddress" },
          { Name: "FirstName", FieldType: "Text", MaxLength: 50 },
          { Name: "LastName", FieldType: "Text", MaxLength: 50 },
          { Name: "Country", FieldType: "Text", MaxLength: 2 },
          { Name: "Tier", FieldType: "Text", MaxLength: 20 },
          { Name: "Points", FieldType: "Number" },
          { Name: "SignupDate", FieldType: "Date" },
          { Name: "IsActive", FieldType: "Boolean" }
      ]
  });
  var fxDE = DataExtension.Init("Customers");
  var fxRows = [
      ["C001", "anna@example.com", "Anna", "Becker", "DE", "Gold", 1200, "2023-02-01", true],
      ["C002", "ben@example.com", "Ben", "Clark", "US", "Silver", 300, "2024-05-10", true],
      ["C003", "carla@example.org", "Carla", "Diaz", "ES", "Gold", 950, "2024-07-20", false],
      ["C004", "dirk@example.com", "Dirk", "Engel", "DE", "Bronze", 40, "2025-01-05", true],
      ["C005", "eva@example.com", "Eva", "Fischer", "DE", "Gold", 2100, "2025-03-15", true],
      ["C006", "finn@example.net", "Finn", "Graham", "US", "Bronze", 0, "2025-09-30", false],
      ["C007", "gus@example.de", "Gus", "Hansen", "FR", null, 10, "2026-01-10", false]
  ];
  for (var fxI = 0; fxI < fxRows.length; fxI++) {
      var fx = fxRows[fxI];
      var fxRow = { SubscriberKey: fx[0], Email: fx[1], FirstName: fx[2], LastName: fx[3], Country: fx[4], Points: fx[6], SignupDate: fx[7], IsActive: fx[8] };
      if (fx[5] !== null) { fxRow.Tier = fx[5]; }
      fxDE.Rows.Add(fxRow);
  }
  assert("fixture created", "" + fxCreate.Status, "OK");

  /* --- page example (verbatim) --- */
  Platform.Load("core", "1.1.5");
  var customers = DataExtension.Init("Customers");
  var proxy = new Script.Util.WSProxy();

  // The same miss ("XX" matches no row) through every method
  var a = Platform.Function.Lookup("Customers", "FirstName", "Country", "XX");
  var b = Platform.Function.LookupRows("Customers", "Country", "XX");
  var c = Platform.Function.LookupOrderedRows("Customers", 0, "Points DESC", "Country", "XX");
  var d = customers.Rows.Lookup(["Country"], ["XX"]);
  var e = customers.Rows.Retrieve({ Property: "Country", SimpleOperator: "equals", Value: "XX" });
  var f = proxy.retrieve("DataExtensionObject[Customers]", ["SubscriberKey"],
      { Property: "Country", SimpleOperator: "equals", Value: "XX" });
  // a, b, c and d are null; e.length and f.Results.length are 0

  // The same Number column through a typed and a string-returning method
  var typed = Platform.Function.LookupRows("Customers", "SubscriberKey", "C001")[0].Points;
  var text = customers.Rows.Retrieve({ Property: "SubscriberKey", SimpleOperator: "equals", Value: "C001" })[0].Points;
  // typed is the number 1200, text is the string "1200"

  /* --- assertions --- */
  assert("Lookup miss returns null", a === null ? "true" : "false", "true");
  assert("LookupRows miss returns null", b === null ? "true" : "false", "true");
  assert("LookupOrderedRows miss returns null", c === null ? "true" : "false", "true");
  assert("Rows.Lookup miss returns null", d === null ? "true" : "false", "true");
  assert("Rows.Retrieve miss returns an empty collection", "" + e.length, "0");
  assert("WSProxy miss returns Status OK", "" + f.Status, "OK");
  assert("WSProxy miss returns no Results", "" + f.Results.length, "0");
  assert("LookupRows returns a Number column as number", typeof typed, "number");
  assert("LookupRows Number value", "" + typed, "1200");
  assert("Rows.Retrieve returns a Number column as string", typeof text, "string");
  assert("Rows.Retrieve Number value", "" + text, "1200");

  /* --- cleanup --- */
  assert("fixture deleted", "" + fxProxy.deleteBatch("DataExtension", [{ CustomerKey: "Customers" }]).Status, "OK");
  </script>

sql-to-filter: |
  <script runat="server">
  /*
   * Chapter: From SQL WHERE to an SSJS filter
   *
   * Creates the "Customers" fixture Data Extension (Name = external key),
   * runs the page example VERBATIM, asserts its results, then deletes the
   * fixture again.
   *
   * EXPECTED OUTPUT: every line starts with PASS.
   */
  function assert(id, actual, expected) {
      Platform.Response.Write((actual === expected ? "PASS " : "FAIL ") + id + " -> [" + actual + "]\n");
  }
  function byText(a, b) { return a < b ? -1 : (a > b ? 1 : 0); }
  function sortedKeys(r) {
      var k = [];
      for (var x = 0; x < r.Results.length; x++) {
          var p = r.Results[x].Properties;
          for (var y = 0; y < p.length; y++) { if (("" + p[y].Name) === "SubscriberKey") { k.push("" + p[y].Value); } }
      }
      k.sort(byText);
      return k.join(",");
  }
  Platform.Load("core", "1.1.5");

  /* --- fixture --- */
  var fxProxy = new Script.Util.WSProxy();
  try { fxProxy.deleteBatch("DataExtension", [{ CustomerKey: "Customers" }]); } catch (fxE) {}
  var fxCreate = fxProxy.createItem("DataExtension", {
      Name: "Customers", CustomerKey: "Customers",
      Fields: [
          { Name: "SubscriberKey", FieldType: "Text", MaxLength: 50, IsPrimaryKey: true, IsRequired: true },
          { Name: "Email", FieldType: "EmailAddress" },
          { Name: "FirstName", FieldType: "Text", MaxLength: 50 },
          { Name: "LastName", FieldType: "Text", MaxLength: 50 },
          { Name: "Country", FieldType: "Text", MaxLength: 2 },
          { Name: "Tier", FieldType: "Text", MaxLength: 20 },
          { Name: "Points", FieldType: "Number" },
          { Name: "SignupDate", FieldType: "Date" },
          { Name: "IsActive", FieldType: "Boolean" }
      ]
  });
  var fxDE = DataExtension.Init("Customers");
  var fxRows = [
      ["C001", "anna@example.com", "Anna", "Becker", "DE", "Gold", 1200, "2023-02-01", true],
      ["C002", "ben@example.com", "Ben", "Clark", "US", "Silver", 300, "2024-05-10", true],
      ["C003", "carla@example.org", "Carla", "Diaz", "ES", "Gold", 950, "2024-07-20", false],
      ["C004", "dirk@example.com", "Dirk", "Engel", "DE", "Bronze", 40, "2025-01-05", true],
      ["C005", "eva@example.com", "Eva", "Fischer", "DE", "Gold", 2100, "2025-03-15", true],
      ["C006", "finn@example.net", "Finn", "Graham", "US", "Bronze", 0, "2025-09-30", false],
      ["C007", "gus@example.de", "Gus", "Hansen", "FR", null, 10, "2026-01-10", false]
  ];
  for (var fxI = 0; fxI < fxRows.length; fxI++) {
      var fx = fxRows[fxI];
      var fxRow = { SubscriberKey: fx[0], Email: fx[1], FirstName: fx[2], LastName: fx[3], Country: fx[4], Points: fx[6], SignupDate: fx[7], IsActive: fx[8] };
      if (fx[5] !== null) { fxRow.Tier = fx[5]; }
      fxDE.Rows.Add(fxRow);
  }
  assert("fixture created", "" + fxCreate.Status, "OK");

  /* --- page example (verbatim) --- */
  // SQL:  WHERE Country IN ('DE', 'ES') AND Points >= 500
  var filter = {
      LeftOperand: { Property: "Country", SimpleOperator: "IN", Value: ["DE", "ES"] },
      LogicalOperator: "AND",
      RightOperand: { Property: "Points", SimpleOperator: "greaterThanOrEqual", Value: "500" }
  };

  var proxy = new Script.Util.WSProxy();
  var result = proxy.retrieve("DataExtensionObject[Customers]", ["SubscriberKey", "Points"], filter);
  // result.Results holds the rows C001, C003 and C005

  /* --- assertions --- */
  assert("example: Status OK", "" + result.Status, "OK");
  assert("example: rows matched", sortedKeys(result), "C001,C003,C005");
  function wsKeys(flt) {
      try {
          var r = proxy.retrieve("DataExtensionObject[Customers]", ["SubscriberKey"], flt);
          return ("" + r.Status) === "OK" ? sortedKeys(r) : "STATUS:" + r.Status;
      } catch (wsErr) {
          return "THREW:" + ("" + wsErr.message);
      }
  }
  assert("SQL equal: equals", wsKeys({ Property: "Tier", SimpleOperator: "equals", Value: "Gold" }), "C001,C003,C005");
  assert("SQL not-equal: notEquals", wsKeys({ Property: "Country", SimpleOperator: "notEquals", Value: "US" }), "C001,C003,C004,C005,C007");
  assert("SQL greater: greaterThan", wsKeys({ Property: "Points", SimpleOperator: "greaterThan", Value: "1200" }), "C005");
  assert("SQL greater-or-equal: greaterThanOrEqual", wsKeys({ Property: "Points", SimpleOperator: "greaterThanOrEqual", Value: "1200" }), "C001,C005");
  assert("SQL less: lessThan", wsKeys({ Property: "Points", SimpleOperator: "lessThan", Value: "300" }), "C004,C006,C007");
  assert("SQL less-or-equal: lessThanOrEqual", wsKeys({ Property: "Points", SimpleOperator: "lessThanOrEqual", Value: "300" }), "C002,C004,C006,C007");
  assert("LIKE contains", wsKeys({ Property: "Email", SimpleOperator: "like", Value: "example.com" }), "C001,C002,C004,C005");
  assert("like ignores where % stands (nna% still finds anna)", wsKeys({ Property: "Email", SimpleOperator: "like", Value: "nna%" }), "C001");
  assert("like ignores where % stands (%ann still finds anna)", wsKeys({ Property: "Email", SimpleOperator: "like", Value: "%ann" }), "C001");
  assert("IN list", wsKeys({ Property: "Country", SimpleOperator: "IN", Value: ["DE", "ES"] }), "C001,C003,C004,C005");
  assert("BETWEEN", wsKeys({ Property: "Points", SimpleOperator: "between", Value: ["100", "1000"] }), "C002,C003");
  assert("IS NULL", wsKeys({ Property: "Tier", SimpleOperator: "isNull", Value: "" }), "C007");
  assert("IS NOT NULL", wsKeys({ Property: "Tier", SimpleOperator: "isNotNull", Value: "" }), "C001,C002,C003,C004,C005,C006");
  assert("date greaterThan", wsKeys({ Property: "SignupDate", SimpleOperator: "greaterThan", Value: "2024-12-31" }), "C004,C005,C006,C007");
  assert("boolean equals true", wsKeys({ Property: "IsActive", SimpleOperator: "equals", Value: "true" }), "C001,C002,C004,C005");
  assert("OR", wsKeys({ LeftOperand: { Property: "Tier", SimpleOperator: "equals", Value: "Silver" }, LogicalOperator: "OR", RightOperand: { Property: "Country", SimpleOperator: "equals", Value: "ES" } }), "C002,C003");
  assert("existsInString is rejected via Status", wsKeys({ Property: "Email", SimpleOperator: "existsInString", Value: "example" }).indexOf("STATUS:Error") === 0 ? "true" : "false", "true");
  var rr = DataExtension.Init("Customers").Rows.Retrieve(filter);
  var rrKeys = []; for (var q = 0; q < rr.length; q++) { rrKeys.push("" + rr[q].SubscriberKey); } rrKeys.sort(byText);
  assert("Rows.Retrieve takes the same filter object", rrKeys.join(","), "C001,C003,C005");
  function rrFilterKeys(flt) {
      try {
          var rs = DataExtension.Init("Customers").Rows.Retrieve(flt);
          var k = [];
          for (var z = 0; z < rs.length; z++) { k.push("" + rs[z].SubscriberKey); }
          k.sort(byText);
          return k.join(",");
      } catch (rrErr) {
          return "THREW:" + ("" + rrErr.message);
      }
  }
  assert("Rows.Retrieve SQL equal: equals", rrFilterKeys({ Property: "Tier", SimpleOperator: "equals", Value: "Gold" }), "C001,C003,C005");
  assert("Rows.Retrieve SQL not-equal: notEquals", rrFilterKeys({ Property: "Country", SimpleOperator: "notEquals", Value: "US" }), "C001,C003,C004,C005,C007");
  assert("Rows.Retrieve SQL greater: greaterThan", rrFilterKeys({ Property: "Points", SimpleOperator: "greaterThan", Value: "1200" }), "C005");
  assert("Rows.Retrieve SQL greater-or-equal: greaterThanOrEqual", rrFilterKeys({ Property: "Points", SimpleOperator: "greaterThanOrEqual", Value: "1200" }), "C001,C005");
  assert("Rows.Retrieve SQL less: lessThan", rrFilterKeys({ Property: "Points", SimpleOperator: "lessThan", Value: "300" }), "C004,C006,C007");
  assert("Rows.Retrieve SQL less-or-equal: lessThanOrEqual", rrFilterKeys({ Property: "Points", SimpleOperator: "lessThanOrEqual", Value: "300" }), "C002,C004,C006,C007");
  assert("Rows.Retrieve LIKE contains", rrFilterKeys({ Property: "Email", SimpleOperator: "like", Value: "example.com" }), "C001,C002,C004,C005");
  assert("Rows.Retrieve like ignores where % stands", rrFilterKeys({ Property: "Email", SimpleOperator: "like", Value: "nna%" }), "C001");
  assert("Rows.Retrieve IN list", rrFilterKeys({ Property: "Country", SimpleOperator: "IN", Value: ["DE", "ES"] }), "C001,C003,C004,C005");
  assert("Rows.Retrieve BETWEEN", rrFilterKeys({ Property: "Points", SimpleOperator: "between", Value: ["100", "1000"] }), "C002,C003");
  assert("Rows.Retrieve IS NULL", rrFilterKeys({ Property: "Tier", SimpleOperator: "isNull", Value: "" }), "C007");
  assert("Rows.Retrieve IS NOT NULL", rrFilterKeys({ Property: "Tier", SimpleOperator: "isNotNull", Value: "" }), "C001,C002,C003,C004,C005,C006");
  assert("Rows.Retrieve date greaterThan", rrFilterKeys({ Property: "SignupDate", SimpleOperator: "greaterThan", Value: "2024-12-31" }), "C004,C005,C006,C007");
  assert("Rows.Retrieve boolean equals true", rrFilterKeys({ Property: "IsActive", SimpleOperator: "equals", Value: "true" }), "C001,C002,C004,C005");
  assert("Rows.Retrieve OR", rrFilterKeys({ LeftOperand: { Property: "Tier", SimpleOperator: "equals", Value: "Silver" }, LogicalOperator: "OR", RightOperand: { Property: "Country", SimpleOperator: "equals", Value: "ES" } }), "C002,C003");

  /* --- cleanup --- */
  assert("fixture deleted", "" + fxProxy.deleteBatch("DataExtension", [{ CustomerKey: "Customers" }]).Status, "OK");
  </script>

