  assert("DEV typeof [].flat is undefined (spec: function)", typeof nested.flat, "undefined");
  assertThrows("DEV [].flat() throws (spec: flattens nested arrays)", function () { return nested.flat(); });

  function flatten(a) {
      var result = [];
      for (var i = 0; i < a.length; i++) {
