# Test scripts for /ecmascript-builtins/array-methods/
#
# One key per chapter on the page. Each script is a self-contained SSJS
# CloudPage snippet that asserts every claim the chapter makes — positive,
# negative, and every documented deviation from the ECMAScript spec.
#
# All scripts were last run green (every line PASS) against a live SFMC
# CloudPage. Re-run them before changing any claim on the page.
#
# AUTHORING RULE: report each assertion on its own Platform.Response.Write
# call. Concatenating several independent expressions into one Write can
# interleave their evaluation in the Jint engine and pair labels with the
# wrong values.

push: |
  <script runat="server">
  Platform.Load("core", "1.1.5");

  /*
   * Chapter: push(...items)
   *
   * Proves:
   *   1. push is available (typeof "function").
   *   2. Appending a single item mutates the array in place: [1,2,3] -> [1,2,3,4].
   *   3. push returns the NEW length of the array.
   *   4. Multiple items can be appended in one call.
   *
   * EXPECTED OUTPUT: every line starts with PASS.
   */

  function assert(id, actual, expected) {
      var got;
      try { got = String(actual); } catch (ex) { got = "THREW: " + ex.message; }
      Platform.Response.Write((got === String(expected) ? "PASS " : "FAIL ") + id + " -> [" + got + "]\n");
  }

  var pushArr = [1, 2, 3];
  assert("typeof [].push is function", typeof pushArr.push, "function");
  var pushRet = pushArr.push(4);
  assert("[1,2,3].push(4) makes [1,2,3,4]", pushArr.join(","), "1,2,3,4");
  assert("push returns the new length 4", pushRet, "4");
  var pushArr2 = [1];
  var pushRet2 = pushArr2.push(2, 3);
  assert("push(2,3) appends both items", pushArr2.join(","), "1,2,3");
  assert("push(2,3) returns the new length 3", pushRet2, "3");
  </script>

