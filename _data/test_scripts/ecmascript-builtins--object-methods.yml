entries: |
  <script runat="server">
  Platform.Load("core", "1.1.5");

  /*
   * Chapter: Object.entries(obj) — Missing
   *
   * Proves:
   *   1. DEVIATION marked "DEV": Object.entries is typeof "undefined"
   *      (spec: a function). Reading it does not throw.
   *   2. Calling it throws, in both forms:
