# Getting-started narrative test scripts.

origins: |
  <script runat="server">
  /*
   * Chapter: Origins
   * Proves:
   *   1. Engine is ES3-era: var works; JSON global absent.
   * EXPECTED OUTPUT: every line starts with PASS.
   */
  function assert(id, actual, expected) {
      Platform.Response.Write((actual === expected ? "PASS " : "FAIL ") + id + " -> [" + actual + "]\n");
  }
  function typeOfThunk(fn) {
      try { return "" + fn(); } catch (ex) { return "THREW:" + ("" + ex.message); }
  }
  var ok = true;
  assert("var works", ok ? "true" : "false", "true");
  assert("JSON global absent", typeOfThunk(function () { return typeof JSON; }), "undefined");
  </script>

what-ssjs-can-do: |
  <script runat="server">
  /*
   * Chapter: What SSJS Can Do
   * Proves:
   *   1. Platform.Function.ParseJSON/Stringify available without Core load.
   * EXPECTED OUTPUT: every line starts with PASS.
   */
  function assert(id, actual, expected) {
      Platform.Response.Write((actual === expected ? "PASS " : "FAIL ") + id + " -> [" + actual + "]\n");
  }
  function typeOfThunk(fn) {
      try { return "" + fn(); } catch (ex) { return "THREW:" + ("" + ex.message); }
  }
  var o = Platform.Function.ParseJSON('{"a":1}');
  assert("ParseJSON", o.a, 1);
  assert("Stringify has a", Platform.Function.Stringify(o).indexOf("a") >= 0 ? "true" : "false", "true");
  assert("WSProxy ctor exists", typeof Script.Util.WSProxy, "clr");
  </script>

