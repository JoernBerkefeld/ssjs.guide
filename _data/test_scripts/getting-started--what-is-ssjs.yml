how-ssjs-relates-to-javascript: |
  <script runat="server">
  /*
   * Chapter: How SSJS Relates to JavaScript
   * Proves:
   *   1. greet example; Write needs Core; no fetch/console.
   * EXPECTED OUTPUT: every line starts with PASS.
   */
  function assert(id, actual, expected) {
      Platform.Response.Write((actual === expected ? "PASS " : "FAIL ") + id + " -> [" + actual + "]\n");
  }
  function typeOfThunk(fn) {
      try { return "" + fn(); } catch (ex) { return "THREW:" + ("" + ex.message); }
  }
  function greet(name) { return "Hello, " + name + "!"; }
  assert("greet", greet("World"), "Hello, World!");
  assert("console absent", typeOfThunk(function () { return typeof console; }), "undefined");
  assert("fetch absent", typeOfThunk(function () { return typeof fetch; }), "undefined");
  Platform.Load("core", "1.1.5");
  assert("Write after Load", typeOfThunk(function () { return typeof Write; }), "function");
  </script>

