generic-rest-helper: |
  <script runat="server">
  /*
   * Chapter: Generic REST Helper
   * Proves:
   *   1. Helper builds HttpRequest without send.
   * EXPECTED OUTPUT: every line starts with PASS.
   */
  function assert(id, actual, expected) {
      Platform.Response.Write((actual === expected ? "PASS " : "FAIL ") + id + " -> [" + actual + "]\n");
  }
  function assertThrows(id, fn) {
      var threw = false, msg = "";
      try { fn(); } catch (ex) { threw = true; msg = "" + ex.message; }
      Platform.Response.Write((threw ? "PASS " : "FAIL ") + id + " -> " + (threw ? "threw: " + msg : "did NOT throw") + "\n");
  }
  function typeOfThunk(fn) {
      try { return "" + fn(); } catch (ex) { return "THREW:" + ("" + ex.message); }
  }
  function apiCall(method, url, token, body) {
      var req = new Script.Util.HttpRequest(url);
      req.method = method;
      req.contentType = "application/json";
      if (token) req.setHeader("Authorization", "Bearer " + token);
      // postData is write-only — assignment is fine; never read it (unguarded read → HTTP 422)
      if (body) req.postData = Platform.Function.Stringify(body);
      return req;
  }
  var r = apiCall("POST", "https://example.com/", "tok", { x: 1 });
  assert("apiCall returns clr", typeof r, "clr");
  assert("setHeader exists", typeof r.setHeader, "clrmethodinfo");
  assert("method POST", "" + r.method, "POST");
  </script>

external-api-with-retry: |
  <script runat="server">
  /*
   * Chapter: External API with Retry
   * Proves:
   *   1. Retry loop counter pattern.
   * EXPECTED OUTPUT: every line starts with PASS.
   */
  function assert(id, actual, expected) {
      Platform.Response.Write((actual === expected ? "PASS " : "FAIL ") + id + " -> [" + actual + "]\n");
  }
  function assertThrows(id, fn) {
      var threw = false, msg = "";
      try { fn(); } catch (ex) { threw = true; msg = "" + ex.message; }
      Platform.Response.Write((threw ? "PASS " : "FAIL ") + id + " -> " + (threw ? "threw: " + msg : "did NOT throw") + "\n");
  }
  function typeOfThunk(fn) {
      try { return "" + fn(); } catch (ex) { return "THREW:" + ("" + ex.message); }
  }
  function shouldRetry(statusCode, attempt, maxRetries) {
      return attempt < maxRetries && (statusCode >= 500 || statusCode === 429);
  }
  assert("retry 500", shouldRetry(500, 0, 3) ? "true" : "false", "true");
  assert("no retry 400", shouldRetry(400, 0, 3) ? "true" : "false", "false");
  assert("exhausted", shouldRetry(500, 3, 3) ? "true" : "false", "false");
  </script>

