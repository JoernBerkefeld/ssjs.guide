# Narrative recipe test scripts — re-probe before claim edits.

paginated-retrieval-of-all-records: |
  <script runat="server">
  /*
   * Chapter: Paginated Retrieval of All Records
   * Proves:
   *   1. WSProxy retrieve/getNextBatch typeof.
   * EXPECTED OUTPUT: every line starts with PASS.
   */
  function assert(id, actual, expected) {
      Platform.Response.Write((actual === expected ? "PASS " : "FAIL ") + id + " -> [" + actual + "]\n");
  }
  function assertThrows(id, fn) {
      var threw = false, msg = "";
      try { fn(); } catch (ex) { threw = true; msg = "" + ex.message; }
      Platform.Response.Write((threw ? "PASS " : "FAIL ") + id + " -> " + (threw ? "threw: " + msg : "did NOT throw") + "\n");
  }
  function typeOfThunk(fn) {
      try { return "" + fn(); } catch (ex) { return "THREW:" + ("" + ex.message); }
  }
  var proxy = new Script.Util.WSProxy();
  assert("retrieve", typeof proxy.retrieve, "clrmethodinfo");
  assert("getNextBatch", typeof proxy.getNextBatch, "clrmethodinfo");
  </script>

