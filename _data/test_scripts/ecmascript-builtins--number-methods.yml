   *      false. isFinite("") and isFinite(null) are also true, but that is
   *      spec-correct — ToNumber("") and ToNumber(null) are both 0. Both
   *      sides are asserted below.
   *
   * EXPECTED OUTPUT: every line starts with PASS.
   */

