# Test scripts for /core-library/contentareabyname/
#
# One key per chapter on the page. Each script is a self-contained SSJS
# CloudPage snippet that asserts every claim the chapter makes — positive,
# negative, and the documented deviation from the official Salesforce docs.
#
# All scripts were last run green (every line PASS) against a live SFMC
# CloudPage. Re-run them before changing any claim on the page.
#
# AUTHORING RULE: report each assertion on its own Platform.Response.Write
# call. Concatenating several independent expressions into one Write can
# interleave their evaluation in the Jint engine and pair labels with the
# wrong values.
#
# ENGINE NOTE: engine-returned values and caught .message values are .NET/CLR
# strings. They are normalized with `"" + value` — never with String(value),
# which yields a CLR string whose === against a JS literal is false and whose
# .indexOf() aborts the whole page with HTTP 422.

parameters: |
  <script runat="server">

  /*
   * Chapter: Parameters —
   *   ContentAreaByName(name[, regionName, errorMsg, fallbackContent])
   *
   * Proves:
   *   1. The bare-name global requires Platform.Load: before the load it does
   *      not resolve at all (typeof is "undefined", resolved lazily inside a
   *      thunk so an unbound name cannot abort the page).
   *   2. After Platform.Load("core", "1.1.5") it is a genuine JS function
   *      (typeof "function"), not the phantom "clrmethodinfo" marker the
   *      qualified Platform.Function form reports.
   *   3. DEV the required `name` parameter alone — the minimal documented
   *      call — does NOT return content: it throws. The official docs
   *      describe a 1-argument call as valid and returning the content-area
   *      markup.
   *   4. DEV the documented optional `regionName` (parameter 2) does not work
   *      either, and fails DIFFERENTLY: it is rejected as a resolved-value
   *      parameter. A string literal, the empty string and null all throw.
   *   5. DEV because parameter 2 is rejected, the documented string `errorMsg`
   *      (parameter 3) and `fallbackContent` (parameter 4) are UNREACHABLE:
   *      arity 3 and arity 4 throw, so neither the error message nor the
   *      fallback string is ever returned.
   *   6. Arities outside the documented 1..4 range (0 and 5) throw as well.
   *
   * NOT ASSERTED: the exact text of the thrown messages beyond a stable
   * fragment check on arity 1 and arity 2. Each message is printed verbatim
   * next to its assertion for the reader.
   *
   * EXPECTED OUTPUT: every line starts with PASS. A FAIL means the runtime no
   * longer matches the documented claim and the page must be revised.
   */

  function assert(id, actual, expected) {
      Platform.Response.Write((actual === expected ? "PASS " : "FAIL ") + id + " -> [" + actual + "]\n");
  }
  function assertThrows(id, fn) {
      var threw = false, msg = "";
      try { fn(); } catch (ex) { threw = true; msg = "" + ex.message; }
      Platform.Response.Write((threw ? "PASS " : "FAIL ") + id + " -> " + (threw ? "threw: " + msg : "did NOT throw") + "\n");
  }
  function typeOf(fn) {
      try { return "" + fn(); } catch (ex) { return "THREW: " + ("" + ex.message); }
  }

  /* 1. Before the Core load the bare name does not resolve. */
  assert("before Platform.Load the bare name is undefined", typeOf(function () { return typeof ContentAreaByName; }), "undefined");

  Platform.Load("core", "1.1.5");

  /* 2. After the load it is a real function, not a CLR method proxy. */
  assert("after Platform.Load typeof ContentAreaByName is function", typeOf(function () { return typeof ContentAreaByName; }), "function");
  assert("typeof Platform.Function.ContentAreaByName is clrmethodinfo", typeOf(function () { return typeof Platform.Function.ContentAreaByName; }), "clrmethodinfo");

  /* 3. DEV the minimal documented call (name only) throws. */
  assertThrows("DEV arity 1 with a folder-path name throws (docs: returns the content)", function () {
      return ContentAreaByName("My Content\\myContentArea");
  });
  assertThrows("DEV arity 1 with a bare name throws too", function () {
      return ContentAreaByName("myContentArea");
  });

  /* 4. DEV the documented optional regionName is rejected as a resolved value. */
  assertThrows("DEV arity 2 regionName string literal throws (docs: optional impression region)", function () {
      return ContentAreaByName("My Content\\myContentArea", "impressionRegion");
  });
  assertThrows("DEV arity 2 empty-string regionName throws as well", function () {
      return ContentAreaByName("My Content\\myContentArea", "");
  });
  assertThrows("DEV arity 2 null regionName throws as well", function () {
      return ContentAreaByName("My Content\\myContentArea", null);
  });

  /* 5. DEV errorMsg and fallbackContent are unreachable behind that rejection. */
  assertThrows("DEV arity 3 string errorMsg throws (docs: that message is returned)", function () {
      return ContentAreaByName("My Content\\myContentArea", "impressionRegion", "Could not load content area");
  });
  assertThrows("DEV arity 4 fallbackContent never emitted, call throws (docs: fallback is displayed)", function () {
      return ContentAreaByName("My Content\\myContentArea", "impressionRegion", "Could not load content area", "Fallback text here");
  });

  /* 6. Off-signature arities throw as well. */
  assertThrows("arity 0 throws", function () {
      return ContentAreaByName();
  });
  assertThrows("arity 5 throws", function () {
      return ContentAreaByName("a", "reg", "err", "fb", "extra");
  });

  /* The two documented arities fail with two DIFFERENT, stable messages. */
  var msg1 = "";
  try { ContentAreaByName("My Content\\myContentArea"); } catch (e1) { msg1 = "" + e1.message; }
  assert("arity 1 message names the failed ContentAreaByName function call", msg1.indexOf("evaluate a ContentAreaByName function call") >= 0 ? "true" : "false", "true");
  var msg2 = "";
  try { ContentAreaByName("My Content\\myContentArea", "impressionRegion"); } catch (e2) { msg2 = "" + e2.message; }
  assert("DEV arity 2 message names ImpressionRegionName as the rejected parameter", msg2.indexOf("ImpressionRegionName") >= 0 ? "true" : "false", "true");
  assert("DEV arity 2 rejects it as a ResolvedValueParameter", msg2.indexOf("ResolvedValueParameter") >= 0 ? "true" : "false", "true");
  </script>

description: |
  <script runat="server">

  /*
   * Chapter: Description — requires Platform.Load, is a genuine function, is
   * still no escape hatch, and how it differs from
   * Platform.Function.ContentAreaByName.
   *
   * Proves:
   *   1. The documented Platform.Load requirement: the bare name is undefined
   *      before Platform.Load("core", "1.1.5") and a function afterwards,
   *      while the qualified Platform.Function form resolves without any load.
   *   2. DEV the failure is NOT "this business unit has no Content Areas". A
   *      WSProxy retrieve of the ContentArea SOAP object returns Status OK
   *      with at least one real area present, yet every by-name call still
   *      throws — so the deprecation, not an empty account, is what fails.
   *   3. Every name shape fails the same way: a folder-path name, a bare name
   *      and the empty string all throw. No call shape returns a value, so
   *      the global is no escape hatch for the deprecated qualified form.
   *   4. DEV the documented 3rd-parameter difference (string errorMsg here vs
   *      boolean stopOnError on the qualified form) cannot be exercised:
   *      arity 3 throws for the string form exactly as the qualified form
   *      throws for the boolean one.
   *   5. The recommended replacement path is real: Platform.Function resolves
   *      ContentBlockByName as a host method (the documented modern
   *      substitute for classic Content Areas).
   *
   * NOT ASSERTED: the frontmatter availability claims for email and triggered
   * send. Those hold only in a send context; a CloudPage GET cannot observe
   * them, so they are recorded as blocked in the verification DB instead.
   * NOT ASSERTED: a by-name call against a known-good area name. The SOAP
   * ContentArea object in this business unit returns an empty Name for the
   * area it exposes, so no verifiable name string can be fed to the function.
   * NOT ASSERTED: that a Content Area ever renders — no arity of either form
   * returns a value, so there is no positive result to assert.
   *
   * EXPECTED OUTPUT: every line starts with PASS.
   */

  function assert(id, actual, expected) {
      Platform.Response.Write((actual === expected ? "PASS " : "FAIL ") + id + " -> [" + actual + "]\n");
  }
  function assertThrows(id, fn) {
      var threw = false, msg = "";
      try { fn(); } catch (ex) { threw = true; msg = "" + ex.message; }
      Platform.Response.Write((threw ? "PASS " : "FAIL ") + id + " -> " + (threw ? "threw: " + msg : "did NOT throw") + "\n");
  }
  function typeOf(fn) {
      try { return "" + fn(); } catch (ex) { return "THREW: " + ("" + ex.message); }
  }

  /* 1. The Platform.Load requirement, both before and after. */
  assert("bare name is undefined before Platform.Load", typeOf(function () { return typeof ContentAreaByName; }), "undefined");
  assert("qualified form resolves WITHOUT Platform.Load", typeOf(function () { return typeof Platform.Function.ContentAreaByName; }), "clrmethodinfo");

  Platform.Load("core", "1.1.5");

  assert("bare name is a genuine function after Platform.Load", typeOf(function () { return typeof ContentAreaByName; }), "function");

  /* 2. A real Content Area exists in this business unit. */
  var realCount = 0;
  var proxyStatus = "";
  try {
      var prox = new Script.Util.WSProxy();
      var res = prox.retrieve("ContentArea", ["ID", "Name"], null);
      proxyStatus = "" + res.Status;
      if (res.Results && res.Results.length > 0) { realCount = res.Results.length; }
  } catch (ex) {
      proxyStatus = "threw: " + ("" + ex.message);
  }
  assert("WSProxy retrieve of the ContentArea object succeeds", proxyStatus, "OK");
  assert("DEV at least one real Content Area exists in this BU, yet no by-name call works", realCount > 0 ? "true" : "false", "true");

  /* 3. Every name shape fails identically — the global is no escape hatch. */
  assertThrows("a folder-path name throws", function () {
      return ContentAreaByName("My Content\\myContentArea");
  });
  assertThrows("a bare name throws", function () {
      return ContentAreaByName("myContentArea");
  });
  assertThrows("the empty string throws", function () {
      return ContentAreaByName("");
  });

  /* 4. DEV the documented string errorMsg (3rd parameter) is unusable. */
  assertThrows("DEV arity 3 with the string errorMsg throws (docs: returns that message)", function () {
      return ContentAreaByName("My Content\\myContentArea", "impressionRegion", "Could not load content area");
  });
  assertThrows("the qualified form's boolean stopOnError throws at arity 3 too", function () {
      return Platform.Function.ContentAreaByName("My Content\\myContentArea", "impressionRegion", false);
  });

  /* 5. The documented modern replacement resolves as a host method. */
  assert("typeof Platform.Function.ContentBlockByName is clrmethodinfo", typeOf(function () { return typeof Platform.Function.ContentBlockByName; }), "clrmethodinfo");
  </script>

no-working-call-shape: |
  <script runat="server">

  /*
   * Differs-from-docs claim: the official Salesforce documentation presents
   * the global ContentAreaByName(name, regionName, errorMsg, fallbackContent)
   * as an ordinary callable returning the content area's rendered markup,
   * with errorMsg returned on failure and fallbackContent displayed when
   * nothing is returned. At runtime NO arity returns a value.
   *
   * Official docs: ContentAreaByName("My Content\\myContentArea",
   *                "impressionRegion", "err", "fallback") returns the content
   *                the area produced.
   * SFMC runtime:  arity 1     -> "An error occurred when attempting to
   *                                evaluate a ContentAreaByName function
   *                                call."
   *                arity 2     -> "A ContentAreaByName function call includes
   *                                an invalid parameter value. … must be a
   *                                literal (constant) values."
   *                                Parameter Name: ImpressionRegionName
   *                                Parameter Ordinal: 2
   *                                Parameter Type: ResolvedValueParameter
   *                arity 0/3/4/5 -> "Unable to retrieve security descriptor
   *                                for this frame." (arity 0 with an
   *                                undefined message)
   *
   * Proves every part of the claim:
   *   1. DEV arity 1 throws for a folder-path name, a bare name and the empty
   *      string — even though a WSProxy retrieve proves a Content Area exists
   *      in this business unit, so it is not a missing-area problem.
   *   2. DEV arity 2 throws a DIFFERENT, resolved-value error for every
   *      regionName shape: string literal, concatenation, variable, empty
   *      string and null. So the failure is not "literal vs variable" — the
   *      parameter cannot be supplied at all.
   *   3. DEV arity 3 and arity 4 throw as well, which is what makes errorMsg
   *      and fallbackContent unreachable: neither string is ever returned.
   *   4. Arity 0 and arity 5 throw too — no arity from 0 to 5 returns a value.
   *   5. DEV the qualified Platform.Function form throws identically, so the
   *      deviation is not specific to the bare-name Core namespace.
   *
   * NOT ASSERTED: a by-name call against a known-good area name. The SOAP
   * ContentArea object in this business unit reports an empty Name for the
   * area it exposes, so no verifiable name string can be supplied.
   *
   * EXPECTED OUTPUT: every line starts with PASS.
   */

  Platform.Load("core", "1.1.5");

  function assert(id, actual, expected) {
      Platform.Response.Write((actual === expected ? "PASS " : "FAIL ") + id + " -> [" + actual + "]\n");
  }
  function assertThrows(id, fn) {
      var threw = false, msg = "";
      try { fn(); } catch (ex) { threw = true; msg = "" + ex.message; }
      Platform.Response.Write((threw ? "PASS " : "FAIL ") + id + " -> " + (threw ? "threw: " + msg : "did NOT throw") + "\n");
  }

  /* 1. DEV arity 1 throws for every name shape, although an area exists. */
  var realCount = 0;
  try {
      var prox = new Script.Util.WSProxy();
      var res = prox.retrieve("ContentArea", ["ID", "Name"], null);
      if (res.Results && res.Results.length > 0) { realCount = res.Results.length; }
  } catch (ex) { realCount = 0; }
  assert("a real Content Area exists in this BU for this run", realCount > 0 ? "true" : "false", "true");

  assertThrows("DEV arity 1 folder-path name throws (docs: returns content)", function () {
      return ContentAreaByName("My Content\\myContentArea");
  });
  assertThrows("DEV arity 1 bare name throws (docs: returns content)", function () {
      return ContentAreaByName("myContentArea");
  });
  assertThrows("DEV arity 1 empty-string name throws (docs: returns content)", function () {
      return ContentAreaByName("");
  });

  /* 2. DEV every regionName shape is rejected as a resolved value. */
  assertThrows("DEV arity 2 string literal regionName throws", function () {
      return ContentAreaByName("My Content\\myContentArea", "impressionRegion");
  });
  assertThrows("DEV arity 2 concatenated regionName throws", function () {
      return ContentAreaByName("My Content\\myContentArea", "impression" + "Region");
  });
  var dynRegion = "impressionRegion";
  assertThrows("DEV arity 2 variable regionName throws", function () {
      return ContentAreaByName("My Content\\myContentArea", dynRegion);
  });
  assertThrows("DEV arity 2 empty-string regionName throws", function () {
      return ContentAreaByName("My Content\\myContentArea", "");
  });
  assertThrows("DEV arity 2 null regionName throws", function () {
      return ContentAreaByName("My Content\\myContentArea", null);
  });

  /* 3. DEV errorMsg and fallbackContent never take effect. */
  assertThrows("DEV arity 3 errorMsg throws (docs: the message is returned)", function () {
      return ContentAreaByName("My Content\\myContentArea", "impressionRegion", "Could not load content area");
  });
  assertThrows("DEV arity 4 throws so fallbackContent is never emitted (docs: fallback shown)", function () {
      return ContentAreaByName("My Content\\myContentArea", "impressionRegion", "Could not load content area", "FALLBACK");
  });
  assertThrows("DEV arity 4 with a null regionName throws as well", function () {
      return ContentAreaByName("My Content\\myContentArea", null, "err", "FALLBACK");
  });

  /* 4. Off-signature arities throw too. */
  assertThrows("arity 0 throws", function () {
      return ContentAreaByName();
  });
  assertThrows("arity 5 throws", function () {
      return ContentAreaByName("a", "reg", "err", "fb", "extra");
  });

  /* 5. DEV the qualified Platform.Function form throws identically. */
  assertThrows("DEV qualified arity 1 throws as well", function () {
      return Platform.Function.ContentAreaByName("My Content\\myContentArea");
  });
  assertThrows("DEV qualified arity 2 throws as well", function () {
      return Platform.Function.ContentAreaByName("My Content\\myContentArea", "impressionRegion");
  });
  </script>

examples: |
  <script runat="server">
  Platform.Load("core", "1.1.5");

  /*
   * Chapter: Examples — both documented forms, and the replacement.
   *
   * Proves:
   *   1. DEV example 1, the plain 1-argument call
   *      ContentAreaByName("My Content\\myContentArea"), throws instead of
   *      returning the content area's markup as the docs show, and the
   *      message is the documented "evaluate a ContentAreaByName function
   *      call" error printed in the example comment.
   *   2. DEV example 2, the full 4-argument call
   *      ContentAreaByName("My Content\\myContentArea", "impressionRegion",
   *      "Could not load content area", "Fallback text here"), throws too —
   *      it fails before the documented errorMsg or fallbackContent can be
   *      used.
   *   3. Because the call throws, Platform.Response.Write() never receives a
   *      value: the variable both examples assign to stays undefined, and the
   *      fallback string is never the result.
   *   4. The page's recommended replacement,
   *      Platform.Function.ContentBlockByName, resolves as a host CLR method.
   *
   * NOT ASSERTED: the rendered output of a working Content Area, and whether
   * an impression is recorded for the region. No call shape succeeds, and
   * impression counts only surface in Marketing Cloud tracking reports after
   * a send is processed, which is not observable from within this request.
   *
   * EXPECTED OUTPUT: every line starts with PASS.
   */

  function assert(id, actual, expected) {
      Platform.Response.Write((actual === expected ? "PASS " : "FAIL ") + id + " -> [" + actual + "]\n");
  }
  function assertThrows(id, fn) {
      var threw = false, msg = "";
      try { fn(); } catch (ex) { threw = true; msg = "" + ex.message; }
      Platform.Response.Write((threw ? "PASS " : "FAIL ") + id + " -> " + (threw ? "threw: " + msg : "did NOT throw") + "\n");
  }
  function typeOf(fn) {
      try { return "" + fn(); } catch (ex) { return "THREW: " + ("" + ex.message); }
  }

  /* 1. DEV example 1 — the plain 1-argument call. */
  assertThrows("DEV example 1: ContentAreaByName(name) throws (docs: returns the content)", function () {
      return ContentAreaByName("My Content\\myContentArea");
  });
  var msg1 = "";
  try { ContentAreaByName("My Content\\myContentArea"); } catch (e1) { msg1 = "" + e1.message; }
  assert("example 1 throws the message shown in the example comment", msg1.indexOf("evaluate a ContentAreaByName function call") >= 0 ? "true" : "false", "true");

  /* 3a. The assigned variable therefore never receives a value. */
  var content1;
  try { content1 = ContentAreaByName("My Content\\myContentArea"); } catch (ex1) { /* documented throw */ }
  assert("example 1: the assigned variable stays undefined", typeOf(function () { return typeof content1; }), "undefined");

  /* 2. DEV example 2 — the full 4-argument call with errorMsg and fallback. */
  assertThrows("DEV example 2: the 4-argument call throws (docs: shows the fallback)", function () {
      return ContentAreaByName("My Content\\myContentArea", "impressionRegion", "Could not load content area", "Fallback text here");
  });

  /* 3b. Neither the errorMsg nor the fallback is ever returned. */
  var content2;
  try { content2 = ContentAreaByName("My Content\\myContentArea", "impressionRegion", "Could not load content area", "Fallback text here"); } catch (ex2) { /* documented throw */ }
  assert("example 2: the fallback is never assigned", typeOf(function () { return typeof content2; }), "undefined");
  assert("example 2: the fallback string is NOT the result", content2 === "Fallback text here" ? "true" : "false", "false");
  assert("example 2: the errorMsg string is NOT the result", content2 === "Could not load content area" ? "true" : "false", "false");

  /* 4. The recommended replacement resolves as a host method. */
  assert("typeof Platform.Function.ContentBlockByName is clrmethodinfo", typeOf(function () { return typeof Platform.Function.ContentBlockByName; }), "clrmethodinfo");
  </script>
